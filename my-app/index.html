<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First Deployed App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>?? My Product App</h1>
    <p class="subtitle">A basic app for practising deployment</p>

    <div class="card">
      <h2>Awesome Widget</h2>
      <p>This is a sample product. Click the button to “add to cart”.</p>
      <p class="price">$29.99</p>
      <button id="buyBtn">Add to Cart</button>
      <p id="message"></p>
    </div>

    <p class="footer">Deployed successfully ??</p>
  </div>

  <script>
    const btn = document.getElementById('buyBtn');
    const msg = document.getElementById('message');

    btn.addEventListener('click', () => {
      msg.textContent = 'Added to cart! (This is just a demo)';
      msg.style.color = '#22c55e';
      btn.textContent = 'Added ?';
      btn.disabled = true;
    });
  </script>
</body>
</html>
