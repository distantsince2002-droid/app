<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Isekai Life Tycoon – Beta</title>
<style>
:root{
  --bg:#0b0b14;--panel:#141428;--card:#1a1a30;--accent:#c77dff;--accent2:#00e5ff;
  --text:#eee;--muted:#9a9ab0;--ok:#4caf50;--bad:#e74c3c;--gold:#ffd700;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;font:inherit}
.btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:8px 12px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:#2a2a48;color:var(--text)}
.header{position:sticky;top:0;z-index:100;background:rgba(11,11,20,.95);border-bottom:1px solid #2a2a48;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.stat{font-size:13px;display:flex;align-items:center;gap:4px}
.stat b{color:var(--accent)}
#nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:#10101c;border-bottom:1px solid #2a2a48;position:sticky;top:52px;z-index:90}
#nav button{background:#1e1e38;color:var(--text);border:1px solid #333;border-radius:8px;padding:6px 10px;font-size:12px}
#nav button.active{background:var(--accent);color:#111;border-color:var(--accent)}
.main{padding:12px;max-width:960px;margin:0 auto;padding-bottom:100px}
.panel{display:none}.panel.active{display:block}
.card{background:var(--card);border:1px solid #2e2e4a;border-radius:12px;padding:12px;margin-bottom:10px}
.card.equipped,.card.active-card{border-color:var(--accent);box-shadow:0 0 12px #c77dff33}
.card.locked{opacity:.55}
.section{color:var(--accent);font-weight:700;margin:14px 0 8px;font-size:14px}
.small,.muted{font-size:12px;color:var(--muted)}
.tag{display:inline-block;background:#2a1840;color:var(--accent);font-size:10px;padding:2px 6px;border-radius:6px;margin-left:4px}
.bar{height:8px;background:#222;border-radius:4px;overflow:hidden;margin:4px 0}
.barFill{height:100%;background:var(--accent);width:0%;transition:width .25s}
.flex{display:flex;gap:10px;align-items:flex-start}
.pet-img,.portrait{width:64px;height:80px;object-fit:cover;border-radius:8px;border:2px solid var(--accent);background:#222}
#tapBtn{width:100%;max-width:320px;margin:16px auto;display:block;padding:18px;font-size:18px;border-radius:16px;background:linear-gradient(135deg,#c77dff,#7b2ff7);color:#fff;border:none;box-shadow:0 0 24px #c77dff55}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1a1a30;border:1px solid var(--accent);color:#fff;padding:10px 16px;border-radius:10px;z-index:20000;opacity:0;transition:.25s;pointer-events:none;max-width:90%}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:5000;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{background:#1a1a2e;border:2px solid var(--accent);border-radius:16px;max-width:520px;width:100%;padding:20px;position:relative;max-height:90vh;overflow:auto}
.modal .close{position:absolute;right:10px;top:8px;background:none;border:none;color:#fff;font-size:22px}
.hero-card{display:inline-block;width:100px;margin:6px;text-align:center;vertical-align:top;border:2px solid #333;border-radius:10px;padding:6px;background:#151528}
.hero-card.unlocked{cursor:pointer;border-color:var(--accent)}
.hero-card.selected{box-shadow:0 0 12px var(--accent)}
.hero-card img{width:88px;height:110px;object-fit:cover;border-radius:8px}
.hero-card.locked{opacity:.45}
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.inv-item{background:#1a1a30;border:2px solid #888;border-radius:12px;padding:10px 6px;text-align:center}
.inv-item.rarity-common{border-color:#888}
.inv-item.rarity-uncommon{border-color:#2ecc71}
.inv-item.rarity-rare{border-color:#3498db}
.inv-item.rarity-legendary{border-color:#f1c40f}
.inv-item .amount{font-weight:700;color:var(--accent)}
.inv-item .name{font-size:12px}
.inv-item .rarity-label{font-size:10px;text-transform:uppercase;opacity:.7}
.armour-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
#avatarBtn{position:fixed;top:10px;left:10px;width:48px;height:48px;border-radius:50%;overflow:hidden;border:3px solid var(--accent);cursor:pointer;z-index:300;background:#1a1a30;padding:0}
#avatarBtn img{width:100%;height:100%;object-fit:cover}
@keyframes tutorialPulse{0%,100%{box-shadow:0 0 12px #c77dff}50%{box-shadow:0 0 28px #c77dff}}
</style>
</head>

<nav id="nav"></nav>

  </div>

  <div id="panel-tames" class="panel"><div id="tamesList"></div></div>
  <div id="panel-mounts" class="panel"><div id="mountsList"></div></div>
  <div id="panel-inventory" class="panel"><div id="inventoryList"></div></div>

  <div id="panel-business" class="panel"><div id="businessList"></div></div>
  <div id="panel-craft" class="panel"><div id="craftList"></div></div>
  <div id="panel-houses" class="panel"><div id="housesList"></div></div>

</main>

<div id="gameModal" class="modal"><div class="modal-box">

  <div id="modalBody" style="white-space:pre-line;line-height:1.5;margin-bottom:16px"></div>
  <div id="modalBtns" style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"></div>
</div></div>

<div id="profileModal" class="modal"><div class="modal-box" style="max-width:440px">
  <button type="button" class="close" onclick="closeModal()">×</button>
  <div style="display:flex;gap:14px;align-items:center;margin-bottom:16px">
    <img id="profileAvatar" style="width:90px;height:120px;object-fit:cover;border-radius:12px;border:2px solid var(--accent)"/>
    <div>

      <div id="avatarTitle" class="small"></div>
      <div class="small">Account: <span id="currentAccountName">default</span></div>
    </div>
  </div>
  <div id="profileStats"></div>
  <div style="margin-top:14px;border-top:1px solid #333;padding-top:12px">
    <h3 style="margin:0 0 8px">Accounts</h3>
    <div id="accountList" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px"></div>
    <div style="display:flex;gap:6px">
      <input id="newAccountName" placeholder="New account" style="flex:1;padding:6px;border-radius:6px;border:1px solid #444;background:#222;color:#fff"/>
      <button class="btn" onclick="createNewAccount()">Create</button>
    </div>
    <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap">

      <button class="btn secondary" onclick="triggerImport()">Import</button>
      <button class="btn" style="background:#a33" onclick="deleteCurrentAccount()">Delete</button>
    </div>
  </div>
  <div style="margin-top:14px;border-top:1px solid #333;padding-top:12px">
    <h3>Achievements <span id="achCount" class="small"></span></h3>
    <div id="achievementList" style="max-height:180px;overflow-y:auto"></div>
  </div>
</div></div>

async function deriveKey(account){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey("raw",enc.encode(MASTER_SECRET+"_"+account),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode("isekai_salt_v1"),iterations:100000,hash:"SHA-256"},keyMaterial,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptData(data,account){
  const key=await deriveKey(account);
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const encrypted=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(data)));
  const combined=new Uint8Array(iv.length+encrypted.byteLength);
  combined.set(iv,0);combined.set(new Uint8Array(encrypted),iv.length);
  let s="";const chunk=8192;
  for(let i=0;i<combined.length;i+=chunk)s+=String.fromCharCode(...combined.subarray(i,i+chunk));
  return ENCRYPTION_PREFIX+btoa(s);
}
async function decryptData(str,account){
  if(!str.startsWith(ENCRYPTION_PREFIX))return JSON.parse(str);
  const key=await deriveKey(account);
  const combined=Uint8Array.from(atob(str.slice(ENCRYPTION_PREFIX.length)),c=>c.charCodeAt(0));
  const decrypted=await crypto.subtle.decrypt({name:"AES-GCM",iv:combined.slice(0,12)},key,combined.slice(12));
  return JSON.parse(new TextDecoder().decode(decrypted));
}
async function save(){
  try{
    const account=state.currentAccount||"default";
    localStorage.setItem("isekaiComplete_"+account,await encryptData({version:SAVE_VERSION,state},account));
  }catch(e){console.error("Save failed",e)}
}
async function load(){
  const account=state.currentAccount||"default";
  const raw=localStorage.getItem("isekaiComplete_"+account);
  if(!raw)return false;
  try{
    const data=await decryptData(raw,account);
    if(data.state)state=Object.assign(structuredClone(defaultState),data.state);
    window.state=state;
    return true;
  }catch(e){console.warn("Load failed",e);return false}
}

}

function applyLoot(loot){if(!loot)return;state.inventory=state.inventory||{};for(const[id,a]of Object.entries(loot))if(a>0)state.inventory[id]=(state.inventory[id]||0)+a}
function hasItem(id,a=1){return(state.inventory?.[id]||0)>=a}
function getItemCount(id){return state.inventory?.[id]||0}
function hasMaterials(req){if(!req)return true;return Object.entries(req).every(([m,a])=>(state.inventory?.[m]||0)>=a)}
function consumeMaterials(req){if(!hasMaterials(req))return false;for(const[m,a]of Object.entries(req)){state.inventory[m]-=a;if(state.inventory[m]<=0)delete state.inventory[m]}return true}
function getAccountList(){try{return JSON.parse(localStorage.getItem("isekai_accounts")||'["default"]')}catch{return["default"]}}
function saveAccountList(list){localStorage.setItem("isekai_accounts",JSON.stringify(list))}
function createAccount(name){name=(name||"").trim().toLowerCase().replace(/\s+/g,"_");if(!name)return false;const list=getAccountList();if(list.includes(name))return false;list.push(name);saveAccountList(list);return true}
async function switchAccount(name){await save();state.currentAccount=name;const ok=await load();if(!ok){state=structuredClone(defaultState);state.currentAccount=name;state.playerName=name==="default"?"Traveler":name;window.state=state}await save();render();toast("Logged in as "+state.playerName)}
function deleteCurrentAccount(){const name=state.currentAccount||"default";if(name==="default")return toast("Cannot delete default");if(!confirm(`Delete "${name}"?`))return;saveAccountList(getAccountList().filter(a=>a!==name));localStorage.removeItem("isekaiComplete_"+name);switchAccount("default")}
function exportSave(){const payload={version:SAVE_VERSION,exportedAt:new Date().toISOString(),account:state.currentAccount,state};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}));a.download=`Isekai_${state.currentAccount}_${Date.now()}.json`;a.click();toast("Exported")}
function triggerImport(){const input=document.createElement("input");input.type="file";input.accept=".json";input.onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=async ev=>{try{const data=JSON.parse(ev.target.result);if(!data.state)return toast("Invalid");if(!confirm("Overwrite?"))return;state=Object.assign(structuredClone(defaultState),data.state);window.state=state;await save();render();toast("Imported")}catch{toast("Import failed")}};r.readAsText(f)};input.click()}
function getCompanionCount(){return Object.values(state.wives||{}).filter(w=>w.unlocked).length}
function getTameCount(){return Object.values(state.pets||{}).filter(p=>p.unlocked).length}
function getMountCount(){return Object.values(state.mounts||{}).filter(m=>m.owned).length}
function getHouseCount(){return Object.values(state.houses||{}).filter(h=>h.owned).length}
function getBusinessCount(){return Object.values(state.businesses||{}).filter(b=>b.owned).length}
function checkAchievements(){let any=false;ACHIEVEMENTS.forEach(a=>{if(!state.achievements[a.id]&&a.check()){state.achievements[a.id]={unlocked:true,date:Date.now()};any=true;toast("Achievement: "+a.name)}});if(any)void save()}
function addToBattleLog(msg){state.battleLog=state.battleLog||[];state.battleLog.unshift(msg);if(state.battleLog.length>30)state.battleLog.pop()}
function clearBattleLog(){state.battleLog=[];renderDungeon();void save()}
setInterval(()=>void save(),30000);

/* ===================== ECONOMY ===================== */
let economyDirty=true,cachedIncome=0.8,cachedTapPower=1;
const economyListeners={};
function onGameEvent(type,cb){(economyListeners[type]=economyListeners[type]||[]).push(cb)}
function emitGameEvent(type,data={}){(economyListeners[type]||[]).forEach(fn=>{try{fn(data)}catch(e){}})}
function markEconomyDirty(){economyDirty=true;emitGameEvent("economy:dirty")}
function getPrestigeMoneyMult(){return 1+(state.prestige||0)*0.25+(state.prestigeUpgrades?.pMoney||0)*0.05}
function getPrestigeResourceMult(){return 1+(state.prestige||0)*0.20+(state.prestigeUpgrades?.pRes||0)*0.05}
function getPrestigeIntimacyMult(){return 1+(state.prestige||0)*0.30+(state.prestigeUpgrades?.pIntim||0)*0.05}
function getActiveHouseBuffs(){
  const id=state.activeHouse;if(id==null||id<0)return{};
  const h=HOUSES.find(x=>x.id===id);if(!h||!h.buff)return{};
  const o={};o[h.buff.type]=1+(h.buff.value||0);return o;
}
function getBusinessIncome(id){
  const b=BUSINESSES.find(x=>x.id===id);const s=state.businesses?.[id];
  if(!b||!s||!s.owned||b.isGuild)return 0;
  let inc=b.baseIncome*(1+(s.level||0)*0.12)*getPrestigeMoneyMult();
  const hb=getActiveHouseBuffs();if(hb.business)inc*=hb.business;
  inc*=(1+getActiveHouseBuff("business"));
  return inc;
}
function totalBusinessIncome(){return BUSINESSES.reduce((s,b)=>s+getBusinessIncome(b.id),0)}
function getPairingBonus(){let pairs=0;const active=state.activePets||[];for(const pet of PETS){if(!active.includes(pet.id))continue;if(pet.pairWith?.some(id=>active.includes(id)))pairs++}return 1+(0.18*pairs)/(1+pairs*0.08)}
function getArmourPower(){let t=0;for(const id of Object.values(state.armour||{})){const r=ARMOUR_RECIPES[id];if(!r)continue;const lvl=state.armourLevels?.[id]||0;t+=r.power*(1+lvl*0.15)}return Math.floor(t)}
function getWeaponPower(){if(!state.weapon||!WEAPONS[state.weapon])return 0;const w=WEAPONS[state.weapon];const lvl=state.weaponLevels?.[state.weapon]||0;return Math.floor(w.power*(1+lvl*0.15))}
function getDefenceRating(){let t=0;for(const id of Object.values(state.armour||{})){const r=ARMOUR_RECIPES[id];if(!r)continue;const lvl=state.armourLevels?.[id]||0;const base=r.defence!=null?r.defence:r.power||0;t+=base*(1+lvl*0.15)}return Math.floor(t)}
function getPlayerPower(){
  let p=25+(state.prestige||0)*18+(state.year||18)*3+getArmourPower()+getWeaponPower()+Object.keys(state.gear||{}).length*8;
  (state.activePets||[]).forEach(id=>{p+=12+(getPetProgress(id).evo||0)*10});
  p*=(1+getActiveHouseBuff("powerAffinity"));
  return Math.floor(p);
}
function getSeasonMult(){const m=Math.floor((state.year||18)*12)%12;if(m<3)return 1.10;if(m<6)return 1.18;if(m<9)return 1.15;return 1.22}
function recalc(){
  let power=1+(state.upgrades?.tapBoost||0)*0.08+(state.prestigeUpgrades?.pTap||0)*0.05+(state.prestige||0)*0.15;
  (state.activePets||[]).forEach(id=>{power*=1+(getPetProgress(id).evo||0)*0.055});
  power*=getPairingBonus();
  let income=0.6+(state.upgrades?.incomeBoost||0)*0.06+(state.prestigeUpgrades?.pIncome||0)*0.05+(state.prestige||0)*0.10;
  (state.activePets||[]).forEach(id=>{const pr=getPetProgress(id);income+=0.15+(pr.evo||0)*0.12});
  income+=totalBusinessIncome();income*=getPrestigeMoneyMult();
  const now=Date.now();
  if(now<(state.tempIncomeEnd||0))income*=(state.tempIncomeMult||1);
  if(now<(state.tempTapEnd||0))power*=(state.tempTapMult||1);
  const season=getSeasonMult();income*=season;power*=season;
  cachedTapPower=Math.max(1,Math.floor(power));cachedIncome=Math.max(0.1,income);economyDirty=false;
}
function getTapPower(){if(economyDirty)recalc();return cachedTapPower}
function getIncome(){if(economyDirty)recalc();return cachedIncome}
function calculateOfflineProgress(){
  if(!state.lastTick)return null;
  const secondsAway=Math.floor((Date.now()-state.lastTick)/1000);
  const effective=Math.min(secondsAway,12*3600);
  if(economyDirty)recalc();
  return{secondsAway,effectiveSeconds:effective,earnings:cachedIncome*effective*getPrestigeMoneyMult(),capped:secondsAway>12*3600};
}
function applyOfflineProgress(){
  const r=calculateOfflineProgress();if(!r||r.earnings<=0)return null;
  state.money+=r.earnings;state.lastTick=Date.now();markEconomyDirty();return r;
}
function addChallengeProgress(key,amount=1){if(!state.challengeProgress)state.challengeProgress={};state.challengeProgress[key]=(state.challengeProgress[key]||0)+amount}
function tap(){
  let power=getTapPower();
  const critChance=0.05+(state.upgrades?.critChance||0)*0.015;
  let crit=false;if(Math.random()<critChance){power=Math.floor(power*2.1);crit=true}
  state.money+=power;addChallengeProgress("daily_tap",1);
  const kChance=0.05+(state.upgrades?.kibbleChance||0)*0.02+(state.prestigeUpgrades?.pKibble||0)*0.03;
  if(Math.random()<kChance)state.kibble=(state.kibble||0)+1;
  if(crit)toast("CRIT! +"+power);markEconomyDirty();
}
function tick(){
  const now=Date.now();const dt=Math.min((now-(state.lastTick||now))/1000,45);state.lastTick=now;
  state.money+=getIncome()*dt;addChallengeProgress("daily_income",getIncome()*dt);
  state.day=(state.day||0)+dt/20;if(state.day>=30){state.day=0;state.year=+(+(state.year||18)+0.1).toFixed(1)}
  state.stamina=Math.min(100,(state.stamina||100)+dt*0.15);
  updateGuildJobs();processIdleDungeon();storyTick();checkPetUnlocks();checkCompanionUnlocks();checkAchievements();
  if(Math.random()<0.0007)state.life=Math.max(10,(state.life||100)-0.12);
}

const COMPANION_GIFTS=[
  {id:"flower",name:"Wildflower Bouquet",cost:400,intimacy:10,affinity:3},
  {id:"chocolate",name:"Dark Chocolate Box",cost:600,intimacy:15,affinity:4},

];
function ensureCompanionState(){WIVES.forEach(d=>{getWife(d.id)});if(WIVES.find(w=>w.id===11)){const ly=getWife(11);if(!ly.unlocked&&(WIVES.find(x=>x.id===11)?.unlock?.start))ly.unlocked=true}}
function dateWife(id){
  const w=getWife(id);if(!w||!w.unlocked)return;
  const now=Date.now();if(w.lastDate&&now-w.lastDate<DATE_COOLDOWN_MS){toast(`Cooldown cooldown (${Math.ceil((DATE_COOLDOWN_MS-(now-w.lastDate))/60000)}m)`);return}
  const today=new Date().toDateString();if(state.lastDateDay!==today){state.dailyDates=0;state.lastDateDay=today}
  if((state.dailyDates||0)>=8)return toast("Daily date limit (8)");
  const gain=Math.floor(30*getPrestigeIntimacyMult()*(1+getActiveHouseBuff("intimacy")));
  w.intimacy=(w.intimacy||0)+gain;w.affinity=(w.affinity||0)+9;w.lastDate=now;state.dailyDates=(state.dailyDates||0)+1;
  while(w.intimacy>=100){w.intimacy-=100;w.level=(w.level||1)+1;w.skillPoints=(w.skillPoints||0)+1}
  toast("Date complete (+"+gain+" intimacy)");addChallengeProgress("date",1);markEconomyDirty();save();renderCompanions();render();
}
function giftWife(id){
  const w=getWife(id);if(!w||!w.unlocked)return;if(state.money<500)return toast("Need 500 gold");
  state.money-=500;const gain=Math.floor(18*getPrestigeIntimacyMult()*(1+getActiveHouseBuff("intimacy")));
  w.intimacy=(w.intimacy||0)+gain;while(w.intimacy>=100){w.intimacy-=100;w.level=(w.level||1)+1}
  state.totalGiftsGiven=(state.totalGiftsGiven||0)+1;addChallengeProgress("gift",1);toast("Gift given (+"+gain+")");markEconomyDirty();save();renderCompanions();render();
}
function favouriteWife(id){const w=getWife(id);if(!w?.unlocked)return;Object.values(state.wives).forEach(x=>x.fav=false);w.fav=true;state.favWife=id;toast("Favourited");save();renderCompanions()}
function summonCompanion(id){
  const def=WIVES.find(x=>x.id===id);if(!def||!SPECIAL_SUMMON_NAMES.includes(def.name))return toast("Cannot summon");
  if(getWife(id).unlocked)return toast("Already unlocked");
  if((state.soulFragments||0)<SOUL_FRAGMENT_COST)return toast("Need "+SOUL_FRAGMENT_COST+" Soul Fragments");
  state.soulFragments-=SOUL_FRAGMENT_COST;setCompanionUnlocked(id,true);toast("Summoned "+def.name);save();renderCompanions();
}
function checkCompanionUnlocks(){/* story/merchant/login handle unlocks */}
function renderCompanions(){
  ensureCompanionState();const list=document.getElementById("companionsList");if(!list)return;
  let html=`<div class="card small">Soul Fragments: <b>${state.soulFragments||0}</b> · Dates free · 2h cooldown · 8/day</div>`;

    const w=getWife(def.id);const locked=!w.unlocked;const isSummon=SPECIAL_SUMMON_NAMES.includes(def.name);

    const cd=w.lastDate?Math.max(0,DATE_COOLDOWN_MS-(Date.now()-w.lastDate)):0;

      <div class="flex"><img class="portrait" src="${def.img||""}" onerror="this.src='https://api.dicebear.com/9.x/lorelei/svg?seed=${encodeURIComponent(def.name)}'"/>
      <div style="flex:1"><strong>${def.name}</strong> <span class="small">(${def.race}) Lv${w.level||1}</span>${w.fav?" ?":""}<br>
      <span class="small">${def.buff||""}</span><div class="bar"><div class="barFill" style="width:${Math.min(100,w.intimacy||0)}%"></div></div>
      ${locked?(isSummon?`<button class="btn" onclick="summonCompanion(${def.id})">Summon (${SOUL_FRAGMENT_COST} SF)</button>`:`<span class="small">Locked</span>`):

       <button class="btn secondary" onclick="dateWife(${def.id})" ${cd>0?"disabled":""}>${cd>0?`Date ${Math.ceil(cd/60000)}m`:"Date"}</button>
       <button class="btn secondary" onclick="favouriteWife(${def.id})">${w.fav?"? Fav":"Favourite"}</button>`}
      </div></div></div>`;
  });
  list.innerHTML=html;

function resetCompanionProgressKeepUnlocked(){Object.values(state.wives||{}).forEach(w=>{if(w.unlocked){w.intimacy=0;w.level=1;w.affinity=Math.floor((w.affinity||0)*0.2);w.lastDate=0}})}

/* ===================== TAMES ===================== */
const MAX_ACTIVE_TAMES=3;
function getForm(id){const p=PETS.find(x=>x.id===id);if(!p?.forms?.length)return{name:"?",buff:""};const evo=Math.min(getPetProgress(id).evo||0,p.forms.length-1);return p.forms[evo]}
function checkPetUnlocks(){
  PETS.forEach(p=>{const pr=getPetProgress(p.id);if(pr.unlocked)return;const u=p.unlock||{};if(u.merchant)return;
    let ok=false;if(u.start)ok=true;if(u.money!=null&&state.money>=u.money)ok=true;if(u.prestige!=null&&(state.prestige||0)>=u.prestige)ok=true;if(u.year!=null&&(state.year||18)>=u.year)ok=true;
    if(ok){pr.unlocked=true;toast(p.name+" can be tamed!")}});
}
function unlockTameFromStory(id){const def=PETS.find(p=>p.id===id);if(def?.unlock?.merchant){console.warn("Blocked merchant tame",id);return false}const pr=getPetProgress(id);if(pr.unlocked)return false;pr.unlocked=true;toast((def?.name||"Tame")+" tamed!");return true}
function unlockTameFromMerchant(id){const pr=getPetProgress(id);if(pr.unlocked)return false;pr.unlocked=true;return true}
function feedPet(id){
  const pr=getPetProgress(id);if(!pr.unlocked)return;if((state.kibble||0)<1)return toast("No kibble");
  state.kibble-=1;pr.kibble=(pr.kibble||0)+25;pr.affinity=(pr.affinity||0)+2;
  if((pr.kibble||0)>=100&&(pr.evo||0)<3){pr.kibble-=100;pr.evo=(pr.evo||0)+1;addChallengeProgress("tameEvo",1);toast(getForm(id).name+" evolved!")}
  markEconomyDirty();renderTames();render();save();
}
function equipPet(id){
  const pr=getPetProgress(id);if(!pr.unlocked)return;state.activePets=state.activePets||[];
  const i=state.activePets.indexOf(id);if(i>=0)state.activePets.splice(i,1);
  else{if(state.activePets.length>=MAX_ACTIVE_TAMES)return toast("Max 3 active");state.activePets.push(id)}
  markEconomyDirty();renderTames();render();save();
}
function renderTames(){
  checkPetUnlocks();const list=document.getElementById("tamesList");if(!list)return;
  let html=`<div class="card small">Active ${(state.activePets||[]).length}/3 · Kibble: ${state.kibble||0}</div>`;
  PETS.forEach(p=>{
    const pr=getPetProgress(p.id);const form=getForm(p.id);const eq=(state.activePets||[]).includes(p.id);
    if(!pr.unlocked){html+=`<div class="card locked"><strong>???</strong><div class="small">${p.unlock?.merchant?"Slave Merchant only":"Locked"}</div></div>`;return}
    html+=`<div class="card ${eq?"equipped":""}"><div class="flex">
      <img class="pet-img" src="${form.img||""}" onerror="this.src='https://api.dicebear.com/9.x/bottts/svg?seed=${p.name}'"/>

      <div class="small">${form.buff||""}</div><div class="bar"><div class="barFill" style="width:${Math.min(100,pr.kibble||0)}%"></div></div>

      <button class="btn secondary" onclick="equipPet(${p.id})">${eq?"Unequip":"Equip"}</button></div></div></div>`;

function resetTameProgressKeepUnlocked(){Object.values(state.pets||{}).forEach(p=>{if(p.unlocked){p.evo=0;p.kibble=0;p.affinity=0}});state.activePets=[]}

/* ===================== STORE / HOUSES / MERCHANT ===================== */
function buyStarter(id){
  const item=STARTER_GEAR.find(i=>i.id===id);if(!item||state.money<item.cost)return;
  if(state.ownedStarters?.[id])return toast("Owned");
  state.money-=item.cost;state.ownedStarters=state.ownedStarters||{};state.ownedStarters[id]=true;
  if(item.slot==="weapon"){state.weapon=id;state.gear[id]=true}
  else if(ARMOUR_RECIPES[id]){state.gear[id]=true;state.armourLevels[id]=0;state.armour[ARMOUR_RECIPES[id].slot]=id}
  toast("Bought "+item.name);addChallengeProgress("upgrade",1);markEconomyDirty();renderStore();render();save();
}
function buyStoreItem(id){
  const item=STORE_ITEMS.find(i=>i.id===id);if(!item)return;
  const level=state.upgrades?.[item.key]||0;
  const cost=item.type==="upgrade"?Math.floor(item.cost*Math.pow(1.45,level)):item.cost;
  if(state.money<cost)return;if(item.max&&level>=item.max)return;
  state.money-=cost;
  if(item.type==="consumable"){
    if(item.effect==="income"){state.tempIncomeMult=item.mult;state.tempIncomeEnd=Date.now()+item.dur}
    if(item.effect==="tap"){state.tempTapMult=item.mult;state.tempTapEnd=Date.now()+item.dur}
    addChallengeProgress("boost",1);toast(item.name+" active!");
  }else{state.upgrades[item.key]=level+1;addChallengeProgress("upgrade",1);toast(item.name+" Lv "+(level+1))}
  markEconomyDirty();renderStore();render();save();
}
function buySlave(id){
  if((state.prestige||0)<1)return toast("Requires first reincarnation");
  const s=SLAVE_MERCHANT_STOCK.find(x=>x.id===id);if(!s||state.money<s.cost)return;
  if(s.type==="companion"&&getWife(s.refId).unlocked)return toast("Owned");
  if(s.type==="tame"&&getPetProgress(s.refId).unlocked)return toast("Owned");
  if(s.type==="mount"&&state.mounts?.[s.refId]?.owned)return toast("Owned");
  state.money-=s.cost;
  if(s.type==="companion")setCompanionUnlocked(s.refId,true);
  else if(s.type==="tame")unlockTameFromMerchant(s.refId);
  else if(s.type==="mount"){state.mounts=state.mounts||{};state.mounts[s.refId]={owned:true}}
  toast("Acquired "+s.name);renderStore();render();save();
}
function buyHouse(id){
  const h=HOUSES.find(x=>x.id===id);if(!h)return;
  if(state.houses?.[id]?.owned)return;if(state.money<h.cost)return;
  state.money-=h.cost;state.houses[id]={owned:true};toast("Bought "+h.name);markEconomyDirty();renderHouses();renderStore();render();save();
}
function activateHouse(id){
  if(!state.houses?.[id]?.owned)return;state.activeHouse=id;toast("Active: "+(HOUSES.find(h=>h.id===id)?.name||id));markEconomyDirty();renderHouses();render();save();
}
function buyMount(id){
  const m=MOUNTS.find(x=>x.id===id);if(!m||m.merchant)return toast("Merchant only");
  if(state.mounts?.[id]?.owned)return;if(state.money<m.cost)return;
  state.money-=m.cost;state.mounts[id]={owned:true};toast("Bought "+m.name);renderMounts();render();save();
}
function equipMount(id){if(!state.mounts?.[id]?.owned)return;state.activeMount=id;toast("Mounted");renderMounts();renderProfile();save()}
function renderStore(){
  const list=document.getElementById("storeList");if(!list)return;let html=`<div class="section">Starter Gear</div>`;
  STARTER_GEAR.forEach(item=>{const owned=!!state.ownedStarters?.[item.id];
    html+=`<div class="card"><strong>${item.name}</strong><div class="small">${item.desc}</div>
    ${owned?`<button class="btn" disabled>Owned</button>`:`<button class="btn" ${state.money<item.cost?"disabled":""} onclick="buyStarter('${item.id}')">Buy ${item.cost}g</button>`}</div>`});
  html+=`<div class="section">Upgrades & Boosts</div>`;
  STORE_ITEMS.forEach(item=>{const lvl=state.upgrades?.[item.key]||0;const cost=item.type==="upgrade"?Math.floor(item.cost*Math.pow(1.45,lvl)):item.cost;const maxed=item.max&&lvl>=item.max;
    html+=`<div class="card"><strong>${item.name}${item.type==="upgrade"?` Lv${lvl}`:""}</strong><div class="small">${item.desc}</div>
    <button class="btn" ${maxed||state.money<cost?"disabled":""} onclick="buyStoreItem('${item.id}')">${maxed?"MAX":cost+"g"}</button></div>`});
  if((state.prestige||0)>=1){
    html+=`<div class="section" style="color:#ff6b6b">Slave Merchant</div>`;
    SLAVE_MERCHANT_STOCK.forEach(s=>{
      let owned=false;if(s.type==="companion")owned=getWife(s.refId).unlocked;if(s.type==="tame")owned=getPetProgress(s.refId).unlocked;if(s.type==="mount")owned=!!state.mounts?.[s.refId]?.owned;
      html+=`<div class="card"><strong>${s.name}</strong><div class="small">${s.desc}</div>
      ${owned?`<button class="btn" disabled>Owned</button>`:`<button class="btn" ${state.money<s.cost?"disabled":""} onclick="buySlave('${s.id}')">Buy ${s.cost.toLocaleString()}g</button>`}</div>`});
  }else html+=`<div class="section">Slave Merchant</div><div class="card locked"><strong>Hooded Merchant</strong><div class="small">Appears after first reincarnation.</div></div>`;
  list.innerHTML=html;
}
function renderHouses(){
  const list=document.getElementById("housesList");if(!list)return;let html="";
  HOUSES.forEach(h=>{const owned=!!state.houses?.[h.id]?.owned;const active=state.activeHouse===h.id;
    const buffTxt=h.buff?`+${((h.buff.value||0)*100).toFixed(0)}% ${h.buff.type}`:"";
    html+=`<div class="card ${active?"active-card":""}"><strong>${h.name}</strong> <span class="small">Rank ${h.rank}/18</span>${active?'<span class="tag">ACTIVE</span>':""}
    <div class="small">${h.desc}</div><div class="small" style="color:#a0e7a0">${buffTxt} (no tap)</div>
    ${!owned?`<button class="btn" ${state.money<h.cost?"disabled":""} onclick="buyHouse(${h.id})">Buy ${h.cost.toLocaleString()}g</button>`:
      active?`<button class="btn" disabled>Active</button>`:`<button class="btn secondary" onclick="activateHouse(${h.id})">Activate</button>`}</div>`});
  list.innerHTML=html;

/* ===================== STORY ===================== */
const STORY_BASE_SEED=2026;

function seededRandom(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return function(){s=(s*16807)%2147483647;return(s-1)/2147483646}}
function generateStoryMap(){
  const seed=getStorySeed(),rand=seededRandom(seed),nodes=[];let id=0;
  STORY_BIOMES.forEach((biome,bi)=>{
    const count=bi<2?4:bi<5?5:6;
    for(let i=0;i<count;i++){
      const group=bi<2?"basic":bi<5?"medium":"hard";
      const key=`${biome.toLowerCase().replace(/\s+/g,"_")}_${i}`;
      nodes.push({id,key,biome,group,title:`${biome} – ${i+1}`,lore:"The path continues through the "+biome+".",
        req:{power:Math.floor(30+id*14+bi*20),money:Math.floor(300+id*180+bi*420),mana:Math.floor(4+id*1.2+bi*2.5),
          houseRank:Math.min(18,Math.floor(bi*1.8+i/2)),mountRank:Math.min(12,Math.floor(bi*1.4+i/2))},
        rewards:{money:Math.floor(500+id*200),materials:group==="basic"?{wood:4+i,herb:2+i}:group==="medium"?{iron_ore:2+i,crystal:1}:{mithril_ore:1+Math.floor(i/2),shadow_essence:1}},
        chargeTime:group==="basic"?8:group==="medium"?12:16,isFinal:bi===STORY_BIOMES.length-1&&i===count-1,rewardKey:STORY_NODE_REWARDS[key]?key:null});
      id++;

}
function ensureStoryState(){
  if(!state.story||typeof state.story!=="object")state.story={current:0,completed:[],charging:null,map:null,extremeMode:false,lastResourceTick:Date.now(),selectedNode:0,storyCompleted:false,mana:12,maxMana:12};
  if(!Array.isArray(state.story.completed))state.story.completed=[];

function onPrestigeStory(){state.story={current:0,completed:[],charging:null,map:null,extremeMode:true,lastResourceTick:Date.now(),selectedNode:0,storyCompleted:false,mana:12,maxMana:Math.min(60,12+(state.prestige||0)*4)};state.storyProgress=0;ensureStoryState()}
function getHousingRank(){let max=0;Object.keys(state.houses||{}).forEach(id=>{if(state.houses[id]?.owned){const h=HOUSES.find(x=>x.id==id);if(h)max=Math.max(max,h.rank||0)}});return max}
function getMaxMountRank(){let max=0;Object.keys(state.mounts||{}).forEach(id=>{const m=MOUNTS.find(x=>x.id===id);if(m&&state.mounts[id]?.owned)max=Math.max(max,m.rank||0)});return max}
function getNodeRequirementErrors(node){
  const errors=[];if(!node)return["Invalid"];if(state.story.completed.includes(node.id))return["Done"];
  if(node.id>0&&!state.story.completed.includes(node.id-1))errors.push("Previous node first");
  const req=node.req||{},power=getPlayerPower();
  if(power<(req.power||0))errors.push(`Power ${power}/${req.power}`);
  if((state.money||0)<(req.money||0))errors.push(`Gold short`);

  if(req.houseRank&&getHousingRank()<req.houseRank)errors.push(`House Rank ${getHousingRank()}/${req.houseRank}`);

  state.kibble=Math.floor((state.kibble||0)*0.3);state.activePets=[];state.activeHouse=-1;state.activeMount=null;
  state.businesses={};state.guild={activeJobs:{},level:0};state.houses={};state.mounts={};
  state.inventory={wood:5,herb:3};state.upgrades={tapBoost:0,incomeBoost:0,kibbleChance:0,critChance:0};
  state.clearedDungeons=[];state.dungeonProgress={};state.activeDungeon=null;state.battleLog=[];state.storyProgress=0;
  state.tempIncomeMult=1;state.tempIncomeEnd=0;state.tempTapMult=1;state.tempTapEnd=0;
  resetArmourKeepStarter();resetCompanionProgressKeepUnlocked();resetTameProgressKeepUnlocked();
  if(typeof resetHouseMountEquip==="function")resetHouseMountEquip();
  state.hero=0;
}
function doPrestige(){
  const gate=canPrestige();if(!gate.ok)return showModal("? Not Ready ?",gate.reason);
  const gain=estimatePP();state.prestige=(state.prestige||0)+1;state.prestigePoints=(state.prestigePoints||0)+gain;
  const newly=unlockNextHero();applyPrestigeSoftReset();onPrestigeStory();
  state.pendingHeroSelect=true;markEconomyDirty();save();
  let msg=`Reincarnation complete!\nPrestige ${state.prestige}\n+${gain} PP`;if(newly)msg+=`\nNew hero: ${newly.name}`;
  showModal("? Reincarnation ?",msg);setTimeout(()=>{playCutscene("prestige_return",()=>openHeroSelect(true))},400);
}
function buyPrestigeUpgrade(id){
  const u=PRESTIGE_UPGRADES.find(x=>x.id===id);if(!u)return;const lvl=state.prestigeUpgrades[u.key]||0;if(lvl>=u.max)return;
  const cost=u.cost*(lvl+1);if((state.prestigePoints||0)<cost)return;state.prestigePoints-=cost;state.prestigeUpgrades[u.key]=lvl+1;
  markEconomyDirty();save();renderPrestige();
}
function renderPrestige(){
  const gate=canPrestige();
  document.getElementById("pLevel").textContent=state.prestige||0;
  document.getElementById("pPoints").textContent=state.prestigePoints||0;
  document.getElementById("estPP").textContent=estimatePP();
  const list=document.getElementById("prestigeUpList");if(!list)return;
  let html=`<div class="card"><strong>Reincarnation</strong><div class="small">Year ${(state.year||18).toFixed?.(1)||state.year} · Story: ${state.story?.storyCompleted?"Complete ?":"Incomplete"}</div>
    <button class="btn" ${gate.ok?"":"disabled"} onclick="doPrestige()">Reincarnate (+${estimatePP()} PP)</button>
    ${gate.ok?"":`<div class="small" style="color:#f88">${gate.reason}</div>`}</div><div class="section">Upgrades</div>`;
  PRESTIGE_UPGRADES.forEach(u=>{const lvl=state.prestigeUpgrades[u.key]||0;const cost=u.cost*(lvl+1);
    html+=`<div class="card"><strong>${u.name}</strong> <span class="small">Lv ${lvl}/${u.max}</span><div class="small">${u.desc}</div>
    <button class="btn" ${lvl>=u.max||(state.prestigePoints||0)<cost?"disabled":""} onclick="buyPrestigeUpgrade('${u.id}')">${lvl>=u.max?"Maxed":cost+" PP"}</button></div>`});
  list.innerHTML=html;
}
function openHeroSelect(){
  const grid=document.getElementById("heroGrid"),modal=document.getElementById("heroModal");if(!grid||!modal)return;
  grid.innerHTML=HEROES.map(h=>{const unlocked=(state.unlockedHeroes||[0]).includes(h.id);
    return`<div class="hero-card ${unlocked?"unlocked":"locked"} ${state.hero===h.id?"selected":""}" ${unlocked?`onclick="selectHero(${h.id})"`:""}>
      <img src="${h.img}" alt="${h.name}" onerror="this.style.opacity=.3"/><div class="small">${h.name}</div>${unlocked?"":"??"}</div>`}).join("");
  modal.classList.add("show");
}
function selectHero(id){if(!(state.unlockedHeroes||[]).includes(id))return;state.hero=id;state.pendingHeroSelect=false;document.getElementById("heroModal")?.classList.remove("show");render();save();toast("Form: "+(HEROES[id]?.name||id))}

let currentCutscene=null,cutsceneIndex=0;
const TUTORIAL_CUTSCENES={
  tutorial_welcome:{background:"prestigeReturn",lines:[{speaker:"God",text:"So... another soul has arrived."},{speaker:"God",text:"Welcome to my world, reincarnator."},{speaker:"God",text:"Each death makes you stronger. Let me teach you how to live."}]},
  tutorial_story_explain:{background:"prestigeReturn",lines:[{speaker:"God",text:"The World Map is the heart of your journey."},{speaker:"God",text:"Travel node by node. Only the final node opens Prestige."}]},
  tutorial_complete:{background:"prestigeReturn",lines:[{speaker:"God",text:"That is enough guidance."},{speaker:"God",text:"After you reincarnate, a merchant of the dead will appear. Seek her in the Store."}]},
  tutorial_post_prestige:{background:"prestigeReturn",lines:[{speaker:"God",text:"You have returned."},{speaker:"God",text:"The Slave Merchant now waits in the Store."}]}
};
const CUTSCENES={
  prestige_return:{background:"prestigeReturn",lines:[{speaker:"Narrator",text:"Soft morning light filters through the window."},{speaker:"Lyra",text:"You're awake... Welcome back."},{speaker:"Lyra",text:"The world is waiting for you once more."}]},
  slave_merchant_intro:{background:"slaveMerchantScene",lines:[{speaker:"Merchant",text:"Back again, traveler?"},{speaker:"Merchant",text:"I deal only with those who have died and returned."}]}
};
function playCutscene(id,onFinish=null){
  const cs=CUTSCENES[id]||TUTORIAL_CUTSCENES[id];if(!cs){if(onFinish)onFinish();return}
  currentCutscene=cs;cutsceneIndex=0;
  let overlay=document.getElementById("cutsceneOverlay");
  if(!overlay){overlay=document.createElement("div");overlay.id="cutsceneOverlay";overlay.style.cssText="position:fixed;inset:0;z-index:10000;background:#000;display:flex;flex-direction:column;justify-content:flex-end;align-items:center";document.body.appendChild(overlay)}
  const bg=CUTSCENE_BACKGROUNDS[cs.background]||PRESTIGE_IMAGES[cs.background]||"";
  overlay.innerHTML=`<div style="position:absolute;inset:0;background-image:url('${bg}');background-size:cover;background-position:center;filter:brightness(.7)"></div>
    <div style="position:relative;width:100%;max-width:820px;background:rgba(10,10,25,.93);border-top:3px solid #c77dff;padding:20px 24px;color:#eee">
      <div id="cutsceneSpeaker" style="color:#c77dff;font-weight:700;margin-bottom:6px"></div>
      <div id="cutsceneText" style="line-height:1.55;min-height:60px"></div>
      <button class="btn" style="margin-top:14px" onclick="nextCutsceneLine()">Continue</button></div>`;
  window._cutsceneOnFinish=onFinish;showCutsceneLine();
}
function showCutsceneLine(){if(!currentCutscene)return;const line=currentCutscene.lines[cutsceneIndex];if(!line){endCutscene();return}
  document.getElementById("cutsceneSpeaker").textContent=line.speaker;document.getElementById("cutsceneText").textContent=line.text}
function nextCutsceneLine(){cutsceneIndex++;if(cutsceneIndex>=currentCutscene.lines.length)endCutscene();else showCutsceneLine()}
function endCutscene(){document.getElementById("cutsceneOverlay")?.remove();currentCutscene=null;if(typeof window._cutsceneOnFinish==="function")window._cutsceneOnFinish();window._cutsceneOnFinish=null}

const TUTORIAL_STEPS=[
  {id:"welcome",type:"cutscene",cutsceneId:"tutorial_welcome"},
  {id:"tap_gold",type:"highlight",target:"#tapBtn",message:"Tap the glowing button to earn gold.",requireAction:"tap"},
  {id:"open_business",type:"highlight",target:"[data-tab='business']",message:"Open the Business tab.",requireAction:"tab:business"},
  {id:"buy_first_business",type:"highlight",target:"#businessList .btn",message:"Purchase your first business.",requireAction:"buyBusiness"},
  {id:"open_companions",type:"highlight",target:"[data-tab='companions']",message:"Open Companions.",requireAction:"tab:companions"},
  {id:"open_tames",type:"highlight",target:"[data-tab='tames']",message:"Open Tames.",requireAction:"tab:tames"},
  {id:"open_story",type:"highlight",target:"[data-tab='story']",message:"This is the World Map.",requireAction:"tab:story"},
  {id:"explain_story",type:"cutscene",cutsceneId:"tutorial_story_explain"},
  {id:"open_prestige",type:"highlight",target:"[data-tab='prestige']",message:"One day you will reincarnate.",requireAction:"tab:prestige"},
  {id:"final",type:"cutscene",cutsceneId:"tutorial_complete"}
];
function ensureTutorialState(){if(!state.tutorial)state.tutorial={active:true,step:0,completed:false}}
function isTutorialActive(){ensureTutorialState();return state.tutorial.active&&!state.tutorial.completed}
function startTutorial(){ensureTutorialState();if(state.tutorial.completed)return;state.tutorial.active=true;state.tutorial.step=0;runTutorialStep()}
function runTutorialStep(){
  ensureTutorialState();clearTutorialHighlight();
  if(state.tutorial.step>=TUTORIAL_STEPS.length){completeTutorial();return}
  const step=TUTORIAL_STEPS[state.tutorial.step];
  if(step.type==="cutscene")playCutscene(step.cutsceneId,()=>advanceTutorial());
  else if(step.type==="highlight")highlightElement(step.target,step.message);
}
function advanceTutorial(){state.tutorial.step++;save();runTutorialStep()}
function completeTutorial(){state.tutorial.active=false;state.tutorial.completed=true;clearTutorialHighlight();toast("Tutorial complete");save()}
function highlightElement(selector,message){
  clearTutorialHighlight();const el=document.querySelector(selector);
  if(!el){setTimeout(()=>advanceTutorial(),1500);return}
  const rect=el.getBoundingClientRect();
  const h=document.createElement("div");h.id="tutorialHighlight";
  h.style.cssText=`position:absolute;pointer-events:none;z-index:9990;border:3px solid #c77dff;border-radius:12px;box-shadow:0 0 25px #c77dff;animation:tutorialPulse 1.4s infinite;left:${rect.left+scrollX-6}px;top:${rect.top+scrollY-6}px;width:${rect.width+12}px;height:${rect.height+12}px`;
  document.body.appendChild(h);
  const msg=document.createElement("div");msg.id="tutorialMessage";
  msg.style.cssText="position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(15,10,30,.95);border:2px solid #c77dff;color:#eee;padding:14px 20px;border-radius:12px;z-index:9991;max-width:90%;text-align:center";
  msg.innerHTML=`<strong style="color:#c77dff">God</strong><br>${message}`;document.body.appendChild(msg);
}
function clearTutorialHighlight(){document.getElementById("tutorialHighlight")?.remove();document.getElementById("tutorialMessage")?.remove()}
function onTutorialAction(action){if(!isTutorialActive())return;const step=TUTORIAL_STEPS[state.tutorial.step];if(step?.type==="highlight"&&step.requireAction===action)advanceTutorial()}

/* ===================== DAILY ===================== */
function processLogin(){
  const today=new Date().toDateString();
  if(state.lastLoginDay===today)return;
  if(state.lastLoginDay){const prev=new Date(state.lastLoginDay),now=new Date(today);const diff=(now-prev)/86400000;state.loginStreak=diff<=1.5?(state.loginStreak||0)+1:1}
  else state.loginStreak=1;
  state.lastLoginDay=today;
  // refresh challenges
  const picks=[];const pool=[...CHALLENGE_POOL];while(picks.length<5&&pool.length){const i=Math.floor(Math.random()*pool.length);picks.push(pool.splice(i,1)[0].id)}
  state.dailyChallengeIds=picks;state.challengeProgress={};state.claimedChallenges={};state.challengeDate=today;
  // login reward
  const gold=500+state.loginStreak*100;state.money+=gold;state.kibble=(state.kibble||0)+2;
  if(state.loginStreak===7){const w=WIVES.find(x=>x.name==="Sylvia");if(w)setCompanionUnlocked(w.id,true)}
  if(state.loginStreak===14){const w=WIVES.find(x=>x.name==="Seraphina");if(w)setCompanionUnlocked(w.id,true)}
  toast(`Login day ${state.loginStreak} · +${gold}g`);
}
function renderChallengeList(){
  const el=document.getElementById("challengeList");if(!el)return;
  if(!state.dailyChallengeIds?.length){el.innerHTML="";return}
  let html=`<div class="section">Daily Challenges</div>`;
  state.dailyChallengeIds.forEach(id=>{
    const c=CHALLENGE_POOL.find(x=>x.id===id);if(!c)return;
    const prog=state.challengeProgress?.[c.key]||0;const done=prog>=c.need;const claimed=!!state.claimedChallenges?.[id];
    html+=`<div class="card"><strong>${c.name}</strong><div class="small">${Math.min(prog,c.need)}/${c.need}</div>
    ${claimed?`<button class="btn" disabled>Claimed</button>`:done?`<button class="btn" onclick="claimChallenge('${id}')">Claim</button>`:`<button class="btn" disabled>In progress</button>`}</div>`});
  el.innerHTML=html;
}
function claimChallenge(id){
  const c=CHALLENGE_POOL.find(x=>x.id===id);if(!c||state.claimedChallenges?.[id])return;
  if((state.challengeProgress?.[c.key]||0)<c.need)return;
  state.claimedChallenges[id]=true;
  if(c.reward.money)state.money+=c.reward.money;if(c.reward.kibble)state.kibble=(state.kibble||0)+c.reward.kibble;
  if(c.reward.soulFragments)state.soulFragments=(state.soulFragments||0)+c.reward.soulFragments;
  toast("Challenge claimed!");renderChallengeList();render();save();
}
function renderLoginArea(){const el=document.getElementById("loginArea");if(!el)return;el.innerHTML=`<div class="card small">Login streak: <b>${state.loginStreak||0}</b> · Day 7: Sylvia · Day 14: Seraphina</div>`}

/* ===================== PROFILE / EQUIP ===================== */
function resetHouseMountEquip(){state.activeHouse=-1;state.activeMount=null}
function renderProfile(container){
  container=container||document.getElementById("panel-profile");if(!container)return;
  const hero=HEROES[state.hero]||HEROES[0];
  const house=HOUSES.find(h=>h.id===state.activeHouse);
  const mount=MOUNTS.find(m=>m.id===state.activeMount);
  container.innerHTML=`<div class="card" style="min-height:320px;background:linear-gradient(180deg,rgba(11,11,20,.4),rgba(11,11,20,.85)),#151528;border-color:var(--accent)">
    <div class="flex" style="justify-content:center;align-items:flex-end;gap:16px;padding:24px">
      <img class="portrait" style="width:120px;height:156px" src="${hero.img}" onerror="this.style.opacity=.3"/>
      ${mount?`<div class="small">?? ${mount.name}</div>`:`<div class="small muted">No mount</div>`}
    </div>
    <div class="small">Home: <b>${house?house.name:"None"}</b> · Mount: <b>${mount?mount.name:"None"}</b></div>
    <div class="small">${house?`Buff: +${((house.buff?.value||0)*100).toFixed(0)}% ${house.buff?.type} (no tap)`:"Equip a house for buffs."}</div>
    ${house?`<button class="btn secondary" onclick="state.activeHouse=-1;markEconomyDirty();renderProfile();renderHouses();save()">Unequip House</button>`:""}
    ${mount?`<button class="btn secondary" onclick="state.activeMount=null;renderProfile();renderMounts();save()">Unequip Mount</button>`:""}
  </div>`;
}

/* ===================== UI ===================== */
const TABS=["home","companions","tames","mounts","inventory","store","business","craft","houses","prestige","dungeon","story","profile"];
const TAB_LABELS={home:"Home",companions:"Companions",tames:"Tames",mounts:"Mounts",inventory:"Inventory",store:"Store",business:"Business",craft:"Craft",houses:"Houses",prestige:"Prestige",dungeon:"Dungeon",story:"Story",profile:"Profile"};
const UI={els:{},currentTab:"home",
  init(){
    ["money","prestige","year","life","kibble","pp","incomeText","stamina","mana","defence","avatarImg","avatarIcon","homeHeroName","homePower"].forEach(id=>this.els[id]=document.getElementById(id));
    const nav=document.getElementById("nav");
    if(nav&&!nav.children.length)TABS.forEach(t=>{const b=document.createElement("button");b.type="button";b.textContent=TAB_LABELS[t];b.dataset.tab=t;if(t==="home")b.classList.add("active");b.onclick=()=>showTab(t);nav.appendChild(b)});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
    this.render();
  },
  render(){
    if(!state)return;
    const set=(id,v)=>{if(this.els[id])this.els[id].textContent=v};
    set("money",Math.floor(state.money||0).toLocaleString());set("prestige",state.prestige||0);set("pp",state.prestigePoints||0);
    set("year",state.year!=null?Number(state.year).toFixed(1):"18");set("life",Math.floor(state.life||100));
    set("stamina",Math.floor(state.stamina||100));set("mana",Math.floor(state.mana||0));set("kibble",state.kibble||0);
    if(this.els.defence)this.els.defence.textContent=getDefenceRating();
    if(this.els.incomeText)this.els.incomeText.textContent=getIncome().toFixed(1);
    const hero=HEROES[state.hero]||HEROES[0];
    if(this.els.avatarImg&&hero.img)this.els.avatarImg.src=hero.img;
    if(this.els.avatarIcon&&hero.img)this.els.avatarIcon.src=hero.img;
    if(this.els.homeHeroName)this.els.homeHeroName.textContent=hero.name;
    if(this.els.homePower)this.els.homePower.textContent=`Power: ${getPlayerPower()} · Defence: ${getDefenceRating()}`;
    renderHomeExtras();
  }
};
function showTab(name){
  UI.currentTab=name;
  TABS.forEach(t=>{const p=document.getElementById("panel-"+t);if(p)p.classList.toggle("active",t===name)});
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===name));
  if(name==="companions")renderCompanions();if(name==="tames")renderTames();if(name==="mounts")renderMounts();
  if(name==="inventory")renderInventory();if(name==="store")renderStore();if(name==="business")renderBusiness();
  if(name==="craft")renderCraft();if(name==="houses")renderHouses();if(name==="prestige")renderPrestige();
  if(name==="dungeon")renderDungeon();if(name==="story")renderStory();if(name==="profile")renderProfile();
  onTutorialAction("tab:"+name);
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._tm);toast._tm=setTimeout(()=>t.classList.remove("show"),2500)}
function showModal(title,content,buttons){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").textContent=content;
  const box=document.getElementById("modalBtns");box.innerHTML="";
  (buttons||[{text:"OK",action:null}]).forEach(b=>{const btn=document.createElement("button");btn.type="button";btn.className="btn";btn.textContent=b.text;btn.onclick=()=>{closeModal();if(typeof b.action==="function")b.action()};box.appendChild(btn)});
  document.getElementById("gameModal").classList.add("show");
}
function closeModal(){
  if(state?.pendingHeroSelect){document.getElementById("profileModal")?.classList.remove("show");document.getElementById("gameModal")?.classList.remove("show");return}
  document.getElementById("profileModal")?.classList.remove("show");
  document.getElementById("gameModal")?.classList.remove("show");
  document.getElementById("heroModal")?.classList.remove("show");
}
function getHero(){return HEROES[state.hero]||HEROES[0]}
function openProfile(){
  const h=getHero();
  document.getElementById("profileAvatar").src=h.img||"";
  document.getElementById("avatarTitle").textContent=h.name;
  document.getElementById("playerNameInput").value=state.playerName||"Traveler";
  document.getElementById("currentAccountName").textContent=state.currentAccount||"default";
  document.getElementById("profileStats").innerHTML=`
    <div class="small">Companions: ${getCompanionCount()} · Tames: ${getTameCount()}</div>
    <div class="small">Mounts: ${getMountCount()} · Houses: ${getHouseCount()} · Businesses: ${getBusinessCount()}</div>
    <div class="small">Prestige: ${state.prestige||0} · Defence: ${getDefenceRating()}</div>
    <div class="small">Story nodes: ${(state.story?.completed||[]).length}</div>`;
  document.getElementById("accountList").innerHTML=getAccountList().map(a=>`<button class="btn ${a===state.currentAccount?"":"secondary"}" style="padding:5px 10px" onclick="switchAccount('${a}')">${a}</button>`).join("");
  document.getElementById("achCount").textContent=`(${Object.keys(state.achievements||{}).length}/${ACHIEVEMENTS.length})`;
  document.getElementById("achievementList").innerHTML=ACHIEVEMENTS.map(a=>{const u=!!state.achievements?.[a.id];
    return`<div style="padding:8px;margin-bottom:6px;background:${u?"#1a3a1a":"#222"};border-radius:8px;opacity:${u?1:0.55}"><strong>${a.name}</strong><div class="small">${a.desc}</div></div>`}).join("");
  document.getElementById("profileModal").classList.add("show");
}
function createNewAccount(){const name=document.getElementById("newAccountName").value.trim();if(!name)return;if(createAccount(name)){switchAccount(name);document.getElementById("newAccountName").value="";openProfile()}else toast("Exists")}
function render(){UI.render()}
function renderHomeExtras(){
  const sum=document.getElementById("homeSummary");
  if(sum)sum.innerHTML=`<div class="small">Power <b>${getPlayerPower()}</b> · Def <b>${getDefenceRating()}</b><br>Companions ${getCompanionCount()} · Tames ${getTameCount()} · Houses ${getHouseCount()} · Biz ${getBusinessCount()}</div>`;
  renderLoginArea();renderChallengeList();
}

/* ===================== INIT ===================== */
async function initGame(){
  const loaded=await load();console.log(loaded?"Save loaded":"New game");
  window.state=state;
  processLogin();ensureStoryState();ensureTutorialState();ensureCompanionState();markEconomyDirty();
  const offline=applyOfflineProgress();
  if(offline&&offline.earnings>0)showModal("? Welcome Back ?",`Away ${Math.floor(offline.secondsAway/60)} min.\nEarned ${Math.floor(offline.earnings).toLocaleString()} gold${offline.capped?" (capped 12h)":""}!`);
  UI.init();
  const tapBtn=document.getElementById("tapBtn");
  if(tapBtn)tapBtn.onclick=()=>{tap();onTutorialAction("tap");render()};
  let lastUI=0;
  setInterval(()=>{tick();const now=Date.now();if(now-lastUI>200){render();checkAchievements();lastUI=now}},250);
  setInterval(()=>void save(),15000);
  render();checkAchievements();
  if(state.pendingHeroSelect)openHeroSelect(true);
  if(!state.tutorial?.completed&&state.prestige===0&&(state.year||18)<=18.2)setTimeout(()=>startTutorial(),800);
  console.log("Isekai Life Tycoon Beta ready");
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",()=>{void initGame()});else void initGame();
</script>
