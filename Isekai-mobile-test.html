function processLogin() {
  const today = new Date().toDateString();
  if (state.lastLoginDay !== today) {
    if (state.lastLoginDay) {
      const last = new Date(state.lastLoginDay).getTime();
      const diff = (Date.now() - last) / 86400000;
      state.loginStreak = diff < 2 ? (state.loginStreak || 0) + 1 : 1;
    } else state.loginStreak = 1;
    state.lastLoginDay = today;
    state.loginClaimed = {};
    rollDailyChallenges();
    state.soulFragments = (state.soulFragments || 0) + 1;
    if (typeof toast === "function") toast("Daily login +1 Soul Fragment (streak " + state.loginStreak + ")");
  } else if (!state.dailyChallengeIds || !state.dailyChallengeIds.length) {
    rollDailyChallenges();
  }
}

function rollDailyChallenges() {
  const pool = typeof CHALLENGE_POOL !== "undefined" ? CHALLENGE_POOL.filter(c => c.id !== "all") : [];
  const shuffled = pool.slice().sort(() => Math.random() - 0.5);
  state.dailyChallengeIds = shuffled.slice(0, 4).map(c => c.id);
  const all = typeof CHALLENGE_POOL !== "undefined" ? CHALLENGE_POOL.find(c => c.id === "all") : null;
  if (all) state.dailyChallengeIds.push("all");
  state.challengeProgress = {};
  state.claimedChallenges = {};
  state.challengeDate = new Date().toDateString();
}

function getChallengeDef(id) {
  return typeof CHALLENGE_POOL !== "undefined" ? CHALLENGE_POOL.find(c => c.id === id) : null;
}

function claimChallenge(id) {
  const def = getChallengeDef(id);
  if (!def || state.claimedChallenges?.[id]) return;
  let progress = state.challengeProgress?.[def.key] || 0;
  if (def.id === "all") {
    const others = (state.dailyChallengeIds || []).filter(x => x !== "all");
    progress = others.filter(x => state.claimedChallenges?.[x]).length;
  }
  if (progress < def.target) {
    if (typeof toast === "function") toast("Not complete");
    return;
  }
  state.claimedChallenges[id] = true;
  state.money = (state.money || 0) + 500 + (state.prestige || 0) * 100;
  state.kibble = (state.kibble || 0) + 3;
  if (typeof toast === "function") toast("Challenge claimed: " + def.name);
  void save();
  renderChallengeList();
  if (typeof render === "function") render();
}

function renderChallengeList() {
  const el = document.getElementById("challengeList");
  if (!el) return;
  const ids = state.dailyChallengeIds || [];
  if (!ids.length) {
    el.innerHTML = "";
    return;
  }
  let html = '<div class="section">Daily Challenges</div>';
  ids.forEach(id => {
    const def = getChallengeDef(id);
    if (!def) return;
    let progress = state.challengeProgress?.[def.key] || 0;
    if (def.id === "all") {
      const others = ids.filter(x => x !== "all");
      progress = others.filter(x => state.claimedChallenges?.[x]).length;
    }
    const claimed = !!(state.claimedChallenges && state.claimedChallenges[id]);
    const done = progress >= def.target;
    html += '<div class="card"><strong>' + def.name + "</strong>" +
      '<div class="small">' + def.desc + " · " + Math.min(progress, def.target) + "/" + def.target + "</div>";
    if (claimed) html += '<button type="button" class="btn" disabled>Claimed</button>';
    else html += '<button type="button" class="btn" onclick="claimChallenge(\'' + id + '\')" ' + (done ? "" : "disabled") + ">Claim</button>";
    html += "</div>";
  });
  el.innerHTML = html;
}

function renderLoginArea() {
  const el = document.getElementById("loginArea");
  if (!el) return;
  el.innerHTML = '<div class="card small">Login streak: <b>' + (state.loginStreak || 0) +
    "</b> · Soul Fragments: <b>" + (state.soulFragments || 0) + "</b></div>";
}

  if (name === "business" && typeof renderBusiness === "function") renderBusiness();
  if (name === "craft" && typeof renderCraft === "function") renderCraft();
  if (name === "houses" && typeof renderHouses === "function") renderHouses();
  if (name === "prestige" && typeof renderPrestige === "function") renderPrestige();
  if (name === "dungeon" && typeof renderDungeon === "function") renderDungeon();
  if (name === "story" && typeof renderStory === "function") renderStory();
  if (name === "profile" && typeof renderProfile === "function") renderProfile();
  if (typeof onTutorialAction === "function") onTutorialAction("tab:" + name);
}

function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) {
    t = document.createElement("div");
    t.id = "toast";
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => t.classList.remove("show"), 2500);
}

/** FIXED: HTML strings use innerHTML; plain text uses textContent */
function showModal(title, content, buttons) {
  let modal = document.getElementById("gameModal");
  if (!modal) {
    modal = document.createElement("div");
    modal.id = "gameModal";
    modal.className = "modal";
    modal.innerHTML =
      '<div class="modal-box">' +
      '<button type="button" class="close" onclick="closeModal()">×</button>' +
      '<h2 id="modalTitle" style="color:#c77dff;margin-bottom:10px"></h2>' +
      '<div id="modalBody" style="line-height:1.5;margin-bottom:16px"></div>' +
      '<div id="modalBtns" style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"></div>' +
      "</div>";
    document.body.appendChild(modal);
  }
  document.getElementById("modalTitle").textContent = title || "";
  const body = document.getElementById("modalBody");
  const str = content == null ? "" : String(content);
  if (/<[a-z][\s\S]*>/i.test(str)) body.innerHTML = str;
  else body.textContent = str;

  const box = document.getElementById("modalBtns");
  box.innerHTML = "";
  (buttons || [{ text: "OK", action: null }]).forEach(b => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn";
    btn.textContent = b.text;
    btn.onclick = () => {
      closeModal();
      if (typeof b.action === "function") b.action();
    };
    box.appendChild(btn);
  });
  modal.classList.add("show");
}

function closeModal() {
  if (state && state.pendingHeroSelect) {
    document.getElementById("profileModal")?.classList.remove("show");
    document.getElementById("gameModal")?.classList.remove("show");
    return;
  }
  document.getElementById("profileModal")?.classList.remove("show");
  document.getElementById("gameModal")?.classList.remove("show");
  document.getElementById("heroModal")?.classList.remove("show");
}

function getHero() {
  if (typeof HEROES !== "undefined" && HEROES[state.hero]) return HEROES[state.hero];
  return {
    id: 0,
    name: "Young Adventurer",
    img: (typeof HERO_IMG !== "undefined" ? HERO_IMG : "") + "Young%20Adventurer.jpg"
  };
}

function renderProfile() {
  const h = getHero();
  const statsHtml =
    '<div class="small">Companions: ' + getCompanionCount() + "</div>" +
    '<div class="small">Tames: ' + getTameCount() + "</div>" +
    '<div class="small">Mounts: ' + getMountCount() + "</div>" +
    '<div class="small">Houses: ' + getHouseCount() + "</div>" +
    '<div class="small">Businesses: ' + getBusinessCount() + "</div>" +
    '<div class="small">Prestige: ' + (state.prestige || 0) + "</div>" +
    '<div class="small">Defence: ' + (typeof getDefenceRating === "function" ? getDefenceRating() : 0) + "</div>";

  const av = document.getElementById("profileAvatar");
  const title = document.getElementById("avatarTitle");
  const nameInput = document.getElementById("playerNameInput");
  const accName = document.getElementById("currentAccountName");
  if (av) av.src = h.img || "";
  if (title) title.textContent = h.name;
  if (nameInput) nameInput.value = state.playerName || "Traveler";
  if (accName) accName.textContent = state.currentAccount || "default";
  const stats = document.getElementById("profileStats");
  if (stats) stats.innerHTML = statsHtml;

  const alist = document.getElementById("accountList");
  if (alist && typeof getAccountList === "function") {
    alist.innerHTML = getAccountList().map(a =>
      '<button type="button" class="btn ' + (a === state.currentAccount ? "" : "secondary") +
      '" style="padding:5px 10px" onclick="switchAccount(\'' + a + '\')">' + a + "</button>"
    ).join("");
  }

  const achCount = document.getElementById("achCount");
  const achList = document.getElementById("achievementList");
  if (typeof ACHIEVEMENTS !== "undefined") {
    if (achCount) achCount.textContent = "(" + Object.keys(state.achievements || {}).length + "/" + ACHIEVEMENTS.length + ")";
    if (achList) {
      achList.innerHTML = ACHIEVEMENTS.map(a => {
        const u = !!(state.achievements && state.achievements[a.id]);
        return '<div style="padding:8px;margin-bottom:6px;background:' + (u ? "#1a3a1a" : "#222") +
          ';border-radius:8px;opacity:' + (u ? 1 : 0.55) + '"><strong>' + a.name +
          '</strong><div class="small">' + a.desc + "</div></div>";
      }).join("");
    }
  }

  const panel = document.getElementById("profilePanelContent");
  if (panel) {
    panel.innerHTML =
      '<div class="card flex"><img src="' + (h.img || "") +
      '" style="width:90px;height:120px;object-fit:cover;border-radius:12px;border:2px solid #c77dff" onerror="this.style.opacity=0.3"/>' +
      "<div><strong>" + (state.playerName || "Traveler") + '</strong><div class="small">' + h.name +
      '</div><div class="small">Account: ' + (state.currentAccount || "default") + "</div></div></div>" +
      '<div class="card">' + statsHtml + "</div>" +
      '<div class="card"><button type="button" class="btn secondary" onclick="exportSave()">Export</button> ' +
      '<button type="button" class="btn secondary" onclick="triggerImport()">Import</button> ' +
      '<button type="button" class="btn" style="background:#a33" onclick="deleteCurrentAccount()">Delete</button></div>';
  }
}

function openProfile() {
  renderProfile();
  document.getElementById("profileModal")?.classList.add("show");
}

function createNewAccount() {
  const input = document.getElementById("newAccountName");
  const name = (input && input.value.trim()) || "";
  if (!name) return;
  if (typeof createAccount === "function" && createAccount(name)) {
    void switchAccount(name);
    if (input) input.value = "";
    openProfile();
  } else if (typeof toast === "function") toast("Account already exists");
}

function openHeroSelect(force) {
  const grid = document.getElementById("heroGrid");
  const modal = document.getElementById("heroModal");
  if (!grid || !modal || typeof HEROES === "undefined") return;
  grid.innerHTML = HEROES.map(h => {
    const unlocked = (state.unlockedHeroes || [0]).includes(h.id);
    return '<div class="hero-card ' + (unlocked ? "unlocked" : "locked") +
      (state.hero === h.id ? " selected" : "") + '" ' +
      (unlocked ? 'onclick="selectHero(' + h.id + ')"' : "") + ">" +
      '<img src="' + (h.img || "") + '" alt="' + h.name + '" onerror="this.style.opacity=0.3"/>' +
      '<div class="small">' + h.name + "</div>" + (unlocked ? "" : "🔒") + "</div>";
  }).join("");
  modal.classList.add("show");
}

function selectHero(id) {
  if (!(state.unlockedHeroes || []).includes(id)) return;
  state.hero = id;
  state.pendingHeroSelect = false;
  document.getElementById("heroModal")?.classList.remove("show");
  if (typeof render === "function") render();
  void save();
  if (typeof toast === "function") toast("Form chosen: " + (HEROES[id]?.name || id));
}

function render() {
  UI.render();
}

function renderHomeExtras() {
  const sum = document.getElementById("homeSummary");
  if (sum) {
    const power = typeof getPlayerPower === "function" ? getPlayerPower() : 0;
    const defence = typeof getDefenceRating === "function" ? getDefenceRating() : 0;
    sum.innerHTML = '<div class="small">Power: <b>' + power + "</b> · Defence: <b>" + defence +
      "</b><br>Companions: " + getCompanionCount() + " · Tames: " + getTameCount() +
      " · Houses: " + getHouseCount() + " · Businesses: " + getBusinessCount() + "</div>";
  }
  if (typeof renderLoginArea === "function") renderLoginArea();
  if (typeof renderChallengeList === "function") renderChallengeList();
}

window.UI = UI;
window.showTab = showTab;
window.toast = toast;
window.showModal = showModal;
window.closeModal = closeModal;
window.render = render;
window.openProfile = openProfile;
window.renderProfile = renderProfile;
window.openHeroSelect = openHeroSelect;
window.selectHero = selectHero;
window.getHero = getHero;
window.createNewAccount = createNewAccount;
window.renderHomeExtras = renderHomeExtras;

/* ---------- INIT ---------- */
async function initGame() {
  const loaded = await load();
  console.log(loaded ? "Encrypted save loaded" : "New game started");

  if (typeof processLogin === "function") processLogin();
  if (typeof ensureStoryState === "function") ensureStoryState();
  if (typeof ensureTutorialState === "function") ensureTutorialState();
  if (typeof markEconomyDirty === "function") markEconomyDirty();

  if (typeof applyOfflineProgress === "function") {
    const offline = applyOfflineProgress();
    if (offline && offline.earnings > 0) {
      showModal(
        "✦ Welcome Back ✦",
        "You were away for " + Math.floor(offline.secondsAway / 60) + " minutes.\n" +
        "Earned " + Math.floor(offline.earnings).toLocaleString() + " gold while offline" +
        (offline.capped ? " (capped at 12h)" : "") + "!"
      );
    }
  }

  UI.init();

  const tapBtn = document.getElementById("tapBtn");
  if (tapBtn) {
    tapBtn.onclick = () => {
      if (typeof tap === "function") tap();
      if (typeof onTutorialAction === "function") onTutorialAction("tap");
      if (typeof render === "function") render();
    };
  }

  let lastUI = 0;
  setInterval(() => {
    if (typeof tick === "function") tick();
    if (typeof storyTick === "function") storyTick();
    const now = Date.now();
    if (now - lastUI > 200) {
      if (typeof render === "function") render();
      if (typeof checkAchievements === "function") checkAchievements();
      lastUI = now;
    }
  }, 250);

  setInterval(() => void save(), 15000);

  if (typeof render === "function") render();
  if (typeof checkAchievements === "function") checkAchievements();

  if (state.pendingHeroSelect && typeof openHeroSelect === "function") {
    openHeroSelect(true);
  }

  if (typeof startTutorial === "function") {
    if (!state.tutorial?.completed && (state.prestige || 0) === 0 && (state.year || 18) <= 18.5) {
      setTimeout(() => startTutorial(), 800);
    }
  }

  console.log("Isekai Life Tycoon ready");
}

window.initGame = initGame;

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", () => { void initGame(); });
} else {
  void initGame();
}

/* END OF GAME SCRIPT — only one closing script tag below */
