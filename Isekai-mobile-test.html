<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Isekai Life Tycoon</title>
<style>
:root{
  --bg:#0b0b14;--panel:#141428;--card:#1a1a30;--accent:#c77dff;--accent2:#00e5ff;
  --text:#eee;--muted:#9a9ab0;--ok:#4caf50;--bad:#e74c3c;--gold:#ffd700;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button{cursor:pointer;font:inherit}
.btn{background:var(--accent);color:#111;border:none;border-radius:8px;padding:8px 12px;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.secondary{background:#2a2a48;color:var(--text)}
.header{
  position:sticky;top:0;z-index:100;background:rgba(11,11,20,.96);
  border-bottom:1px solid #2a2a48;padding:8px 12px 8px 64px;
  display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:13px;
}
.header b{color:var(--accent)}
.header img.res-icon{width:16px;height:16px;vertical-align:-3px;margin-right:2px}
#nav{
  display:flex;flex-wrap:wrap;gap:4px;padding:8px;background:#10101c;
  border-bottom:1px solid #2a2a48;position:sticky;top:48px;z-index:90;
}
#nav button{
  background:#1e1e38;color:var(--text);border:1px solid #333;border-radius:8px;
  padding:6px 10px;font-size:12px;
}
#nav button.active{background:var(--accent);color:#111;border-color:var(--accent)}
.main{padding:12px;max-width:980px;margin:0 auto;padding-bottom:120px}
.panel{display:none}
.panel.active{display:block}
.card{
  background:var(--card);border:1px solid #2a2a48;border-radius:12px;
  padding:12px;margin-bottom:10px;overflow:hidden;
}
.card.equipped{border-color:var(--accent)}
.card.locked{opacity:.55}
.card.active-card{outline:2px solid var(--accent2)}
.section{color:var(--accent);font-weight:700;margin:14px 0 8px;font-size:14px}
.small,.muted{font-size:12px;color:var(--muted)}
.tag{display:inline-block;background:#2a2a48;color:var(--accent2);font-size:10px;padding:2px 6px;border-radius:6px;margin-left:4px}
.flex{display:flex;gap:10px;align-items:flex-start}
.bar{height:10px;background:#222;border-radius:6px;overflow:hidden;margin:4px 0}
.barFill{height:100%;background:var(--accent);width:0%;transition:width .25s}
.pet-img,.companion-img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:2px solid #333;background:#111}
#tapBtn{
  display:block;width:100%;max-width:320px;margin:12px auto;padding:16px;
  font-size:1.1rem;background:linear-gradient(135deg,var(--accent),#8b5cf6);color:#111;
}
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1a1a30;border:1px solid var(--accent);padding:10px 16px;border-radius:10px;
  z-index:5000;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:4000;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{
  background:var(--panel);border:1px solid #3a3a60;border-radius:14px;
  padding:16px;max-width:520px;width:100%;max-height:85vh;overflow:auto;position:relative;
}
.modal-box .close{position:absolute;top:8px;right:10px;background:transparent;border:none;color:#aaa;font-size:22px}
.hero-card{display:inline-block;width:100px;text-align:center;margin:6px;padding:6px;border-radius:10px;border:1px solid #333;cursor:pointer;vertical-align:top}
.hero-card img{width:88px;height:110px;object-fit:cover;border-radius:8px}
.hero-card.locked{opacity:.4;cursor:default}
.hero-card.selected{border-color:var(--accent);box-shadow:0 0 12px #c77dff66}
.inventory-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;padding:8px}
.inv-item{background:#1a1a30;border:2px solid #888;border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.inv-item.rarity-common{border-color:#888}
.inv-item.rarity-uncommon{border-color:#2ecc71}
.inv-item.rarity-rare{border-color:#3498db}
.inv-item.rarity-legendary{border-color:#f1c40f}
.inv-item .inv-icon{width:48px;height:48px;object-fit:contain}
.avatar-btn{position:fixed;top:6px;left:8px;z-index:110;border:none;background:transparent;padding:0}
.avatar-btn img{width:44px;height:44px;border-radius:50%;border:2px solid var(--accent);object-fit:cover}
.house-img{width:100%;max-height:140px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block}
</style>
</head>
<body>

<button type="button" class="avatar-btn" id="avatarBtn" title="Profile">
  <img id="avatarIcon" src="" alt="avatar"/>
</button>

<header class="header">
  <span><img class="res-icon" id="icon-gold" alt=""/> <b id="money">0</b></span>
  <span>Year <b id="year">18.0</b></span>
  <span><img class="res-icon" id="icon-life" alt=""/> <b id="life">100</b></span>
  <span><img class="res-icon" id="icon-stamina" alt=""/> <b id="stamina">100</b></span>
  <span><img class="res-icon" id="icon-mana" alt=""/> <b id="mana">50</b></span>
  <span><img class="res-icon" id="icon-kibble" alt=""/> <b id="kibble">0</b></span>
  <span>Souls <b id="souls">0</b></span>
  <span>PP <b id="pp">0</b></span>
  <span>Prestige <b id="prestige">0</b></span>
  <span>DEF <b id="defence">0</b></span>
  <span>Income <b id="incomeText">0</b>/s</span>
</header>

<nav id="nav"></nav>

<main class="main">
  <div id="panel-home" class="panel active">
    <div class="card flex">
      <img id="avatarImg" class="companion-img" alt="hero"/>
      <div>
        <div id="homeHeroName" style="font-weight:700">Young Adventurer</div>
        <div id="homePower" class="small">Power: 0 · Defence: 0</div>
        <div id="homeSummary" class="small"></div>
      </div>
    </div>
    <button type="button" class="btn" id="tapBtn">TAP FOR GOLD</button>
    <div id="loginArea"></div>
    <div id="challengeList"></div>
  </div>

  <div id="panel-companions" class="panel"><div id="companionsList"></div></div>
  <div id="panel-tames" class="panel"><div id="tamesList"></div></div>
  <div id="panel-mounts" class="panel"><div id="mountsList"></div></div>
  <div id="panel-inventory" class="panel"><div id="inventoryList"></div></div>
  <div id="panel-store" class="panel"><div id="storeList"></div></div>
  <div id="panel-business" class="panel"><div id="businessList"></div></div>
  <div id="panel-craft" class="panel"><div id="craftList"></div></div>
  <div id="panel-houses" class="panel"><div id="housesList"></div></div>
  <div id="panel-prestige" class="panel">
    <div class="card">Prestige <b id="pLevel">0</b> · PP <b id="pPoints">0</b> · Est <b id="estPP">0</b></div>
    <div id="prestigeUpList"></div>
  </div>
  <div id="panel-dungeon" class="panel">
    <div id="dungeonList"></div>
    <div id="battleLog" class="card"></div>
  </div>
  <div id="panel-story" class="panel"><div id="storyList"></div></div>
  <div id="panel-profile" class="panel"><div id="profilePanelContent"></div></div>
</main>

<div id="toast"></div>

<div id="gameModal" class="modal">
  <div class="modal-box">
    <button type="button" class="close" onclick="closeModal()">×</button>
    <h2 id="modalTitle" style="color:#c77dff;margin-bottom:10px"></h2>
    <div id="modalBody" style="line-height:1.5;margin-bottom:16px"></div>
    <div id="modalBtns" style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"></div>
  </div>
</div>

<div id="profileModal" class="modal">
  <div class="modal-box">
    <button type="button" class="close" onclick="closeModal()">×</button>
    <img id="profileAvatar" style="width:80px;height:100px;object-fit:cover;border-radius:10px" alt=""/>
    <h2 id="avatarTitle" style="color:#c77dff"></h2>
    <input id="playerNameInput" maxlength="20" style="width:100%;margin:8px 0;padding:8px;background:#111;border:1px solid #444;color:#eee;border-radius:8px"/>
    <div class="small">Account: <span id="currentAccountName">default</span></div>
    <div id="profileStats" style="margin:10px 0"></div>
    <div id="accountList" style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0"></div>
    <input id="newAccountName" placeholder="New account" style="padding:6px;background:#111;border:1px solid #444;color:#eee;border-radius:6px"/>
    <button type="button" class="btn" onclick="createNewAccount()">Create</button>
    <div class="section">Achievements <span id="achCount"></span></div>
    <div id="achievementList"></div>
  </div>
</div>

<div id="heroModal" class="modal">
  <div class="modal-box" style="max-width:640px">
    <button type="button" class="close" onclick="if(!state.pendingHeroSelect)closeModal()">×</button>
    <h2 style="color:#c77dff">Hero Forms</h2>
    <div id="heroGrid"></div>
  </div>
</div>

function getActiveHouseBuff(type) {
  if (state.activeHouse == null || state.activeHouse < 0) return 0;
  const h = HOUSES.find(x => x.id === state.activeHouse);
  if (!h || !h.buff || h.buff.type !== type) return 0;
  const owned = state.houses && state.houses[state.activeHouse] && state.houses[state.activeHouse].owned;
  if (!owned) return 0;
  return h.buff.value || 0;
}

/* ---------- AES ---------- */
async function deriveKey(account) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    "raw",
    enc.encode(MASTER_SECRET + "_" + account),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: enc.encode("isekai_salt_v1"),
      iterations: 100000,
      hash: "SHA-256"
    },
    keyMaterial,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptData(data, account) {
  const key = await deriveKey(account);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(JSON.stringify(data));
  const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoded);
  const combined = new Uint8Array(iv.length + encrypted.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(encrypted), iv.length);
  let s = "";
  const chunk = 8192;
  for (let i = 0; i < combined.length; i += chunk) {
    s += String.fromCharCode(...combined.subarray(i, i + chunk));
  }
  return ENCRYPTION_PREFIX + btoa(s);
}

async function decryptData(str, account) {
  if (!str.startsWith(ENCRYPTION_PREFIX)) return JSON.parse(str);
  const key = await deriveKey(account);
  const combined = Uint8Array.from(
    atob(str.slice(ENCRYPTION_PREFIX.length)),
    c => c.charCodeAt(0)
  );
  const iv = combined.slice(0, 12);
  const data = combined.slice(12);
  const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
  return JSON.parse(new TextDecoder().decode(decrypted));
}

async function save() {
  try {
    const account = state.currentAccount || "default";
    const payload = { version: SAVE_VERSION, state };
    localStorage.setItem("isekaiComplete_" + account, await encryptData(payload, account));
  } catch (e) {
    console.error("Save failed", e);
  }
}

async function load() {
  const account = state.currentAccount || "default";
  const raw = localStorage.getItem("isekaiComplete_" + account);
  if (!raw) return false;
  try {
    const data = await decryptData(raw, account);
    if (data.state) {
      state = Object.assign(structuredClone(defaultState), data.state);
      // deep-merge nested objects that assign is shallow on
      state.upgrades = Object.assign({}, defaultState.upgrades, data.state.upgrades || {});
      state.prestigeUpgrades = Object.assign({}, defaultState.prestigeUpgrades, data.state.prestigeUpgrades || {});
      state.story = Object.assign({}, defaultState.story, data.state.story || {});
      state.tutorial = Object.assign({}, defaultState.tutorial, data.state.tutorial || {});
      state.guild = Object.assign({}, defaultState.guild, data.state.guild || {});
    }
    return true;
  } catch (e) {
    console.warn("Load failed", e);
    return false;
  }
}

}

function getPetProgress(id) {

    state.pets[id] = { unlocked: false, evo: 0, kibble: 0, affinity: 0 };
  }
  return state.pets[id];
}

function setCompanionUnlocked(id, value = true) {

}

}

/* ---------- Inventory ---------- */
function getMaterialMeta(id) {
  if (typeof MATERIALS !== "undefined" && MATERIALS[id]) return MATERIALS[id];
  return { name: String(id).replace(/_/g, " "), rarity: "common", icon: null };
}

function getItemCount(itemId) {
  return state.inventory?.[itemId] || 0;
}

function hasItem(itemId, amount = 1) {
  return getItemCount(itemId) >= amount;
}

function addItem(id, amount = 1) {
  if (!id || amount <= 0) return;
  state.inventory = state.inventory || {};
  state.inventory[id] = (state.inventory[id] || 0) + amount;
}

function removeItem(id, amount = 1) {
  if (!id || amount <= 0) return false;
  state.inventory = state.inventory || {};
  if ((state.inventory[id] || 0) < amount) return false;
  state.inventory[id] -= amount;
  if (state.inventory[id] <= 0) delete state.inventory[id];
  return true;
}

function applyLoot(loot) {
  if (!loot) return;
  state.inventory = state.inventory || {};
  for (const [id, amount] of Object.entries(loot)) {
    if (amount > 0) state.inventory[id] = (state.inventory[id] || 0) + amount;
  }
}

function hasMaterials(mats, mult = 1) {
  if (!mats) return true;
  state.inventory = state.inventory || {};
  return Object.entries(mats).every(([m, a]) => (state.inventory[m] || 0) >= a * mult);
}

function consumeMaterials(mats, mult = 1) {
  if (!hasMaterials(mats, mult)) return false;
  for (const [m, a] of Object.entries(mats)) {
    state.inventory[m] -= a * mult;
    if (state.inventory[m] <= 0) delete state.inventory[m];
  }
  return true;
}

function formatLoot(loot) {
  if (!loot || !Object.keys(loot).length) return "nothing";
  return Object.entries(loot)
    .filter(([, n]) => n > 0)
    .map(([id, n]) => n + "× " + getMaterialMeta(id).name)
    .join(", ");
}

function getSortedInventoryEntries() {
  const inv = state.inventory || {};
  const rarityOrder = { common: 1, uncommon: 2, rare: 3, legendary: 4 };
  return Object.entries(inv)
    .filter(([, amount]) => amount > 0)
    .sort((a, b) => {
      const ra = rarityOrder[getMaterialMeta(a[0]).rarity] || 0;
      const rb = rarityOrder[getMaterialMeta(b[0]).rarity] || 0;
      if (rb !== ra) return rb - ra;
      return b[1] - a[1];
    });
}

function triggerImport() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.state) {
          if (typeof toast === "function") toast("Invalid save file");
          return;
        }
        if (!confirm("Overwrite current account save?")) return;
        state = Object.assign(structuredClone(defaultState), data.state);
        await save();
        if (typeof render === "function") render();
        if (typeof toast === "function") toast("Save imported");
        if (typeof closeModal === "function") closeModal();
      } catch {
        if (typeof toast === "function") toast("Import failed");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

  });
  if (any) void save();

function playAchievementSound() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = "sine";
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch (_) {}
}

/* ---------- ECONOMY ---------- */
let economyDirty = true;
let cachedIncome = 0.8;
let cachedTapPower = 1;
const economyListeners = {};

function onGameEvent(type, cb) {
  if (!economyListeners[type]) economyListeners[type] = [];
  economyListeners[type].push(cb);
}
function emitGameEvent(type, data) {
  data = data || {};
  (economyListeners[type] || []).forEach(fn => {
    try { fn(data); } catch (e) { console.warn("Economy event error", type, e); }
  });
}
function markEconomyDirty() {
  economyDirty = true;
  emitGameEvent("economy:dirty");
}

function getPrestigeMoneyMult() {
  return 1 + (state.prestige || 0) * 0.25 + (state.prestigeUpgrades?.pMoney || 0) * 0.05;
}
function getPrestigeResourceMult() {
  return 1 + (state.prestige || 0) * 0.20 + (state.prestigeUpgrades?.pRes || 0) * 0.05;
}
function getPrestigeIntimacyMult() {
  return 1 + (state.prestige || 0) * 0.30 + (state.prestigeUpgrades?.pIntim || 0) * 0.05;
}

/** Map data buff {type,value} → multipliers for economy */
function getActiveHouseBuffs() {
  const out = { businessIncome: 1, intimacy: 1, powerAffinity: 1, influence: 1 };
  if (state.activeHouse == null || state.activeHouse < 0) return out;
  if (!isHouseOwned(state.activeHouse)) return out;
  const h = typeof HOUSES !== "undefined" ? HOUSES.find(x => x.id === state.activeHouse) : null;
  if (!h || !h.buff) return out;
  const v = h.buff.value || 0;
  if (h.buff.type === "business") out.businessIncome = 1 + v;
  if (h.buff.type === "intimacy") out.intimacy = 1 + v;
  if (h.buff.type === "powerAffinity") out.powerAffinity = 1 + v;
  if (h.buff.type === "influence") out.influence = 1 + v;
  return out;
}

function getBusinessIncome(id) {
  if (typeof BUSINESSES === "undefined") return 0;
  const b = BUSINESSES.find(x => x.id === id);
  const s = state.businesses && state.businesses[id];
  if (!b || !s || !s.owned || b.isGuild) return 0;
  let inc = b.baseIncome * (1 + (s.level || 0) * 0.12) * getPrestigeMoneyMult();
  const hb = getActiveHouseBuffs();
  if (hb.businessIncome) inc *= hb.businessIncome;
  return inc;
}
function totalBusinessIncome() {
  if (typeof BUSINESSES === "undefined") return 0;
  return BUSINESSES.reduce((sum, b) => sum + getBusinessIncome(b.id), 0);
}

function getPairingBonus() {
  if (typeof PETS === "undefined") return 1;
  let pairs = 0;
  const active = state.activePets || [];
  for (const pet of PETS) {
    if (!active.includes(pet.id)) continue;
    if (pet.pairWith && pet.pairWith.some(id => active.includes(id))) pairs++;
  }
  return 1 + (0.18 * pairs) / (1 + pairs * 0.08);
}

function getWeaponPower() {
  if (!state.weapon || typeof WEAPONS === "undefined") return 0;
  const w = WEAPONS[state.weapon];
  if (!w) return 0;
  const lvl = (state.weaponLevels && state.weaponLevels[state.weapon]) || 0;
  return Math.floor(w.power * (1 + lvl * 0.15));
}

function getPlayerPower() {
  let p = 25 + (state.prestige || 0) * 18 + (state.year || 18) * 3;
  if (typeof getArmourPower === "function") p += getArmourPower();
  p += getWeaponPower();
  p += Object.keys(state.gear || {}).length * 8;
  (state.activePets || []).forEach(id => {
    p += 12 + (getPetProgress(id).evo || 0) * 10;
  });
  const hb = getActiveHouseBuffs();
  if (hb.powerAffinity) p *= hb.powerAffinity;
  return Math.floor(p);
}

function getSeasonMult() {
  const m = Math.floor((state.year || 18) * 12) % 12;
  if (m < 3) return 1.10;
  if (m < 6) return 1.18;
  if (m < 9) return 1.15;
  return 1.22;
}

function getCompanionIncomeMult() {
  let mult = 1;
  Object.values(state.wives || {}).forEach(w => {
    if (w && w.unlocked) mult *= 1 + ((w.level || 1) - 1) * 0.012;
  });
  return mult;
}

function recalc() {
  let power = 1
    + (state.upgrades?.tapBoost || 0) * 0.08
    + (state.prestigeUpgrades?.pTap || 0) * 0.05
    + (state.prestige || 0) * 0.15;
  (state.activePets || []).forEach(id => {
    power *= 1 + (getPetProgress(id).evo || 0) * 0.055;
  });
  power *= getPairingBonus();

  let income = 0.6
    + (state.upgrades?.incomeBoost || 0) * 0.06
    + (state.prestigeUpgrades?.pIncome || 0) * 0.05
    + (state.prestige || 0) * 0.10;
  (state.activePets || []).forEach(id => {
    const pr = getPetProgress(id);
    income += 0.15 + (pr.evo || 0) * 0.12;
  });
  income += totalBusinessIncome();
  income *= getPrestigeMoneyMult();

  const now = Date.now();
  if (now < (state.tempIncomeEnd || 0)) income *= (state.tempIncomeMult || 1);
  if (now < (state.tempTapEnd || 0)) power *= (state.tempTapMult || 1);

  const season = getSeasonMult();
  income *= season;
  power *= season;
  const wifeMult = getCompanionIncomeMult();
  power *= wifeMult;
  income *= wifeMult * getPairingBonus();

  cachedTapPower = Math.max(1, Math.floor(power));
  cachedIncome = Math.max(0.1, income);
  economyDirty = false;
}

function getTapPower() {
  if (economyDirty) recalc();
  return cachedTapPower;
}
function getIncome() {
  if (economyDirty) recalc();
  return cachedIncome;
}

function calculateOfflineProgress() {
  if (!state.lastTick) return null;
  const now = Date.now();
  const secondsAway = Math.floor((now - state.lastTick) / 1000);
  const maxOffline = 12 * 3600;
  const effective = Math.min(secondsAway, maxOffline);
  if (economyDirty) recalc();
  const earnings = cachedIncome * effective * getPrestigeMoneyMult();
  return { secondsAway, effectiveSeconds: effective, earnings, capped: secondsAway > maxOffline };
}

function applyOfflineProgress() {
  const result = calculateOfflineProgress();
  if (!result || result.earnings <= 0) return null;
  state.money += result.earnings;
  state.lastTick = Date.now();
  const maxLife = 100 + (state.prestige || 0) * 10;
  state.life = Math.min(maxLife, (state.life || 100) + result.effectiveSeconds / 86400 * 3);
  markEconomyDirty();
  return result;
}

function addChallengeProgress(key, amount) {
  amount = amount == null ? 1 : amount;
  if (!state.challengeProgress) state.challengeProgress = {};
  state.challengeProgress[key] = (state.challengeProgress[key] || 0) + amount;
}

function tap() {
  let power = getTapPower();
  const critChance = 0.05 + (state.upgrades?.critChance || 0) * 0.015;
  let crit = false;
  if (Math.random() < critChance) {
    power = Math.floor(power * 2.1);
    crit = true;
  }
  state.money += power;
  addChallengeProgress("daily_tap", 1);
  const kChance = 0.05
    + (state.upgrades?.kibbleChance || 0) * 0.02
    + (state.prestigeUpgrades?.pKibble || 0) * 0.03;
  if (Math.random() < kChance) {
    state.kibble = (state.kibble || 0) + 1;
    emitGameEvent("economy:kibbleGained", { amount: 1 });
  }
  if (crit && typeof toast === "function") toast("CRIT! +" + power);
  markEconomyDirty();
}

function tick() {
  const now = Date.now();
  const dt = Math.min((now - (state.lastTick || now)) / 1000, 45);
  state.lastTick = now;
  state.money += getIncome() * dt;
  addChallengeProgress("daily_income", getIncome() * dt);

  state.day = (state.day || 0) + dt / 20;
  if (state.day >= 30) {
    state.day = 0;
    state.year = +(+(state.year || 18) + 0.1).toFixed(1);
  }

  state.stamina = Math.min(state.staminaMax || 100, (state.stamina || 100) + dt * 0.15);

  if (typeof updateGuildJobs === "function") updateGuildJobs();
  if (typeof processIdleDungeon === "function") processIdleDungeon();
  if (typeof storyTick === "function") storyTick();
  if (typeof checkPetUnlocks === "function") checkPetUnlocks();
  if (typeof checkCompanionUnlocks === "function") checkCompanionUnlocks();
  if (typeof checkAchievements === "function") checkAchievements();

  if (Math.random() < 0.0007) {
    state.life = Math.max(10, (state.life || 100) - 0.12);
  }
}

const MAX_ACTIVE_TAMES = 3;
const KIBBLE_PER_FEED = 1;
const KIBBLE_PROGRESS_PER_FEED = 25;
const MAX_EVO = 3;

function ensureTameState() {
  if (!state.pets) state.pets = {};
  if (!state.activePets) state.activePets = [];
  if (state.kibble == null) state.kibble = 0;
}

function getTameDef(id) {
  return typeof PETS !== "undefined" ? PETS.find(p => p.id === id) || null : null;
}

function getForm(id) {
  const p = getTameDef(id);
  if (!p || !p.forms || !p.forms.length) return { name: "?", type: "", buff: "", img: "" };
  const pr = getPetProgress(id);
  const evo = Math.min(pr.evo || 0, p.forms.length - 1);
  return p.forms[evo];
}

function tameImg(form, def) {
  if (form && form.img) return form.img;
  const seed = (def && def.name) || (form && form.name) || "tame";
  return "https://api.dicebear.com/9.x/bottts/svg?seed=" + encodeURIComponent(seed);
}

function checkPetUnlocks() {
  ensureTameState();
  if (typeof PETS === "undefined") return;
  PETS.forEach(p => {
    const pr = getPetProgress(p.id);
    if (pr.unlocked) return;
    const u = p.unlock || {};
    if (u.merchant) return;
    let unlock = false;
    if (u.start) unlock = true;
    if (u.money != null && (state.money || 0) >= u.money) unlock = true;
    if (u.prestige != null && (state.prestige || 0) >= u.prestige) unlock = true;
    if (u.year != null && (state.year || 18) >= u.year) unlock = true;
    if (u.dungeon != null && (state.clearedDungeons || []).length >= u.dungeon) unlock = true;
    if (u.story === true && (state.storyProgress || 0) >= 1) unlock = true;
    if (unlock) {
      pr.unlocked = true;
      if (typeof toast === "function") toast((p.name || "Tame") + " can now be tamed!");
    }
  });
}

function unlockTameById(id, announce) {
  announce = announce !== false;
  const def = getTameDef(id);
  const pr = getPetProgress(id);
  if (pr.unlocked) return false;
  if (def && def.unlock && def.unlock.merchant) return false;
  pr.unlocked = true;
  if (announce && typeof toast === "function") toast((def ? def.name : "Tame") + " has been tamed!");
  return true;
}

function unlockTameFromMerchant(id) {
  const pr = getPetProgress(id);
  if (pr.unlocked) return false;
  pr.unlocked = true;
  return true;
}

function unlockTameFromStory(id) {
  const def = getTameDef(id);
  if (def && def.unlock && def.unlock.merchant) {
    console.warn("Blocked story unlock of merchant-only tame", id);
    return false;
  }
  return unlockTameById(id, true);
}

function feedPet(id) {
  ensureTameState();
  const def = getTameDef(id);
  const pr = getPetProgress(id);
  if (!def || !pr.unlocked) return;
  if ((state.kibble || 0) < KIBBLE_PER_FEED) {
    if (typeof toast === "function") toast("No kibble");
    return;
  }
  state.kibble -= KIBBLE_PER_FEED;
  pr.kibble = (pr.kibble || 0) + KIBBLE_PROGRESS_PER_FEED;
  pr.affinity = (pr.affinity || 0) + Math.floor(2 * getPrestigeIntimacyMult());

  if ((pr.kibble || 0) >= 100 && (pr.evo || 0) < MAX_EVO) {
    pr.kibble -= 100;
    pr.evo = (pr.evo || 0) + 1;
    addChallengeProgress("tameEvo", 1);
    emitGameEvent("pet:evolved", { id, evo: pr.evo });
    const form = getForm(id);
    if (typeof showModal === "function") {
      showModal("✦ Evolution ✦", (form.name || def.name) + " evolved to stage " + pr.evo + "!");
    }
  }
  markEconomyDirty();
  renderTames();
  if (typeof render === "function") render();
  void save();
}

function equipPet(id) {
  ensureTameState();
  const pr = getPetProgress(id);
  if (!pr.unlocked) return;
  if (!Array.isArray(state.activePets)) state.activePets = [];
  const idx = state.activePets.indexOf(id);
  if (idx >= 0) {
    state.activePets.splice(idx, 1);
    emitGameEvent("pet:equipped", { id, equipped: false });
  } else {
    if (state.activePets.length >= MAX_ACTIVE_TAMES) {
      if (typeof toast === "function") toast("Max " + MAX_ACTIVE_TAMES + " active tames");
      return;
    }
    state.activePets.push(id);
    emitGameEvent("pet:equipped", { id, equipped: true });
  }
  markEconomyDirty();
  renderTames();
  if (typeof render === "function") render();
  void save();
}

function isTameActive(id) {
  return (state.activePets || []).includes(id);
}

function showTameProfile(id) {
  const def = getTameDef(id);
  const pr = getPetProgress(id);
  if (!def || !pr.unlocked) return;
  const form = getForm(id);
  const body =
    (form.type || "") + " · Evo " + (pr.evo || 0) + "/" + MAX_EVO + "\n" +
    "Buff: " + (form.buff || "—") + "\n" +
    "Kibble progress: " + (pr.kibble || 0) + "/100\n" +
    "Affinity: " + (pr.affinity || 0);
  if (typeof showModal === "function") {
    showModal(form.name || def.name, body, [
      { text: "Feed", action: () => feedPet(id) },
      { text: isTameActive(id) ? "Unequip" : "Equip", action: () => equipPet(id) },
      { text: "Close", action: null }
    ]);
  }
}

function resetTameProgressKeepUnlocked() {
  ensureTameState();
  Object.keys(state.pets || {}).forEach(id => {
    const p = state.pets[id];
    if (p && p.unlocked) { p.evo = 0; p.kibble = 0; p.affinity = 0; }
  });
  state.activePets = [];
}

function renderTames() {
  ensureTameState();
  checkPetUnlocks();
  const list = document.getElementById("tamesList");
  if (!list || typeof PETS === "undefined") return;
  const activeCount = (state.activePets || []).length;
  let html = '<div class="card"><strong>Active ' + activeCount + '/' + MAX_ACTIVE_TAMES +
    '</strong><div class="small">Kibble from tapping · Feed to evolve</div></div>';

  PETS.forEach(p => {
    const pr = getPetProgress(p.id);
    const u = p.unlock || {};
    const merchantOnly = !!u.merchant;
    const eq = isTameActive(p.id);
    const form = getForm(p.id);
    if (!pr.unlocked) {
      html += '<div class="card locked"><strong>???</strong><div class="small">' +
        (merchantOnly ? "Slave Merchant only" : "Locked") + "</div></div>";
      return;
    }
    const src = tameImg(form, p);
    const kibPct = Math.min(100, pr.kibble || 0);
    const fallback = tameImg({}, p);
    html += '<div class="card ' + (eq ? "equipped" : "") + '"><div class="flex">' +
      '<img class="pet-img" src="' + src + '" alt="" loading="lazy" onerror="this.onerror=null;this.src=\'' + fallback + '\'"/>' +
      '<div style="flex:1"><strong>' + (form.name || p.name) + '</strong> ' +
      '<span class="small">Evo ' + (pr.evo || 0) + '/' + MAX_EVO + '</span>' +
      (eq ? ' <span class="tag">ACTIVE</span>' : "") +
      '<div class="small">' + (form.type || "") + " · " + (form.buff || "") + "</div>" +
      '<div class="bar"><div class="barFill" style="width:' + kibPct + '%"></div></div>' +
      '<button type="button" class="btn" onclick="feedPet(' + p.id + ')">Feed</button> ' +
      '<button type="button" class="btn secondary" onclick="equipPet(' + p.id + ')">' + (eq ? "Unequip" : "Equip") + "</button> " +
      '<button type="button" class="btn secondary" onclick="showTameProfile(' + p.id + ')">Info</button>' +
      "</div></div></div>";
  });
  list.innerHTML = html;
}

function ensureCompanionState() {
  if (!state.wives) state.wives = {};
  if (typeof WIVES !== "undefined") {
    WIVES.forEach(def => { getWife(def.id); });
  }
  if (state.favWife === undefined) state.favWife = -1;
  if (state.dailyDates === undefined) state.dailyDates = 0;
  if (state.lastDateDay === undefined) state.lastDateDay = "";
  ensureGiftInventory();
}

function getGift(id) {
  return COMPANION_GIFTS.find(g => g.id === id) || null;
}

function buyGift(giftId, qty) {
  qty = qty || 1;
  const gift = getGift(giftId);
  if (!gift) return false;
  const total = gift.cost * qty;
  if (state.money < total) {
    if (typeof toast === "function") toast("Not enough gold");
    return false;
  }
  state.money -= total;
  ensureGiftInventory();
  state.giftInventory[giftId] = (state.giftInventory[giftId] || 0) + qty;
  if (typeof toast === "function") toast("Bought " + qty + "× " + gift.name);
  markEconomyDirty();
  void save();
  if (typeof render === "function") render();
  return true;
}

function giftCompanion(companionId, giftId) {
  const w = getWife(companionId);
  if (!w || !w.unlocked) {
    if (typeof toast === "function") toast("Companion not unlocked");
    return false;
  }
  const gift = getGift(giftId);
  if (!gift) return false;
  ensureGiftInventory();
  if ((state.giftInventory[giftId] || 0) < 1) {
    if (typeof toast === "function") toast("You don't own this gift");
    return false;
  }
  const prefs = COMPANION_PREFERENCES[companionId] || { loved: [], disliked: [] };
  let mult = 1.0;
  let rejected = false;
  if (prefs.loved.includes(giftId)) mult = 1.8;
  else if (prefs.disliked.includes(giftId)) {
    mult = 0.4;
    if (Math.random() < 0.70) rejected = true;
  }
  state.giftInventory[giftId]--;
  const def = typeof WIVES !== "undefined" ? WIVES.find(x => x.id === companionId) : null;
  if (rejected) {
    if (typeof toast === "function") toast((def ? def.name : "Companion") + " refused the " + gift.name + "…");
    void save();
    return false;
  }
  const prestigeMult = getPrestigeIntimacyMult();
  const houseIntimacy = getActiveHouseBuffs().intimacy || 1;
  const intimacyGain = Math.floor(gift.intimacy * mult * prestigeMult * houseIntimacy);
  const affinityGain = Math.floor(gift.affinity * mult);
  w.intimacy = (w.intimacy || 0) + intimacyGain;
  w.affinity = (w.affinity || 0) + affinityGain;
  while (w.intimacy >= 100) {
    w.intimacy -= 100;
    w.level = (w.level || 1) + 1;
    w.skillPoints = (w.skillPoints || 0) + 1;
    emitGameEvent("wife:levelup", { id: companionId });
  }
  state.totalGiftsGiven = (state.totalGiftsGiven || 0) + 1;
  addChallengeProgress("gift", 1);
  if (typeof toast === "function") {
    toast((def ? def.name : "Companion") + " (+" + intimacyGain + " intimacy)");
  }
  markEconomyDirty();
  void save();
  if (typeof renderCompanions === "function") renderCompanions();
  if (typeof render === "function") render();
  return true;
}

function canDateToday() {
  const today = new Date().toDateString();
  if (state.lastDateDay !== today) {
    state.dailyDates = 0;
    state.lastDateDay = today;
  }
  return (state.dailyDates || 0) < MAX_DAILY_DATES;
}

function dateWife(id) {
  const w = getWife(id);
  if (!w || !w.unlocked) return;
  const now = Date.now();
  if (w.lastDate && (now - w.lastDate) < DATE_CD) {
    const remain = Math.ceil((DATE_CD - (now - w.lastDate)) / 60000);
    if (typeof toast === "function") toast("Date on cooldown (" + remain + " min)");
    return;
  }
  if (!canDateToday()) {
    if (typeof toast === "function") toast("Daily date limit reached (8)");
    return;
  }
  const prestigeMult = getPrestigeIntimacyMult();
  const houseIntimacy = getActiveHouseBuffs().intimacy || 1;
  const intimacyGain = Math.floor(BASE_DATE_INTIMACY * prestigeMult * houseIntimacy);
  w.intimacy = (w.intimacy || 0) + intimacyGain;
  w.affinity = (w.affinity || 0) + 9;
  w.lastDate = now;
  state.dailyDates = (state.dailyDates || 0) + 1;
  while (w.intimacy >= 100) {
    w.intimacy -= 100;
    w.level = (w.level || 1) + 1;
    w.skillPoints = (w.skillPoints || 0) + 1;
  }
  const def = typeof WIVES !== "undefined" ? WIVES.find(x => x.id === id) : null;
  if (typeof toast === "function") toast("Date with " + (def ? def.name : "Companion") + " (+" + intimacyGain + ")");
  addChallengeProgress("dates", 1);
  markEconomyDirty();
  void save();
  renderCompanions();
  if (typeof render === "function") render();
}

function favouriteWife(id) {
  const w = getWife(id);
  if (!w || !w.unlocked) return;
  Object.keys(state.wives).forEach(k => { if (state.wives[k]) state.wives[k].fav = false; });
  w.fav = true;
  state.favWife = id;
  if (typeof toast === "function") toast("Favourited!");
  void save();
  renderCompanions();
}

function summonCompanion(id) {
  const def = typeof WIVES !== "undefined" ? WIVES.find(x => x.id === id) : null;
  if (!def) return;
  if (!SUMMON_NAMES.includes(def.name)) {
    if (typeof toast === "function") toast("Cannot summon this companion");
    return;
  }
  const w = getWife(id);
  if (w.unlocked) {
    if (typeof toast === "function") toast(def.name + " already unlocked");
    return;
  }
  if ((state.soulFragments || 0) < SF_COST) {
    if (typeof toast === "function") toast("Need " + SF_COST + " Soul Fragments");
    return;
  }
  state.soulFragments -= SF_COST;
  setCompanionUnlocked(id, true);
  if (typeof toast === "function") toast("Summoned " + def.name + "!");
  markEconomyDirty();
  void save();
  renderCompanions();
  if (typeof render === "function") render();
}

function checkCompanionUnlocks() {
  ensureCompanionState();
}

function resetCompanionProgressKeepUnlocked() {
  ensureCompanionState();
  Object.keys(state.wives || {}).forEach(id => {
    const w = state.wives[id];
    if (w && w.unlocked) {
      w.intimacy = 0;
      w.level = 1;
      w.affinity = Math.floor((w.affinity || 0) * 0.2);
      w.lastDate = 0;
      w.skillPoints = 0;
    }
  });
}

function showCompanionProfile(id) {
  const def = typeof WIVES !== "undefined" ? WIVES.find(x => x.id === id) : null;
  const w = getWife(id);
  if (!def || !w) return;
  const html =
    '<div style="text-align:center">' +
    '<img src="' + (def.img || "") + '" style="width:120px;height:156px;object-fit:cover;border-radius:12px;border:2px solid var(--accent)" ' +
    'onerror="this.src=\'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(def.name) + '\'"/>' +
    '<h3 style="margin:8px 0">' + def.name + "</h3>" +
    '<div class="small">' + (def.race || "") + " · " + (def.buff || "") + "</div>" +
    "<div>Level <b>" + (w.level || 1) + "</b> · Affinity <b>" + (w.affinity || 0) + "</b></div>" +
    "<div>Intimacy <b>" + (w.intimacy || 0) + "/100</b></div>" +
    '<p style="font-size:13px;margin-top:8px">' + (def.lore || "") + "</p></div>";
  if (typeof showModal === "function") showModal(def.name, html, [{ text: "Close", action: null }]);
}

function renderCompanions() {
  ensureCompanionState();
  const list = document.getElementById("companionsList");
  if (!list || typeof WIVES === "undefined") return;
  let html = "";
  const lockedSummons = WIVES.filter(d => {
    const w = getWife(d.id);
    return SUMMON_NAMES.includes(d.name) && !w.unlocked;
  });
  if (lockedSummons.length) {
    html += '<div class="card"><strong>Soul Fragment Summons</strong><div class="small">Cost ' + SF_COST +
      " · You have " + (state.soulFragments || 0) + '</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">';
    lockedSummons.forEach(d => {
      html += '<button type="button" class="btn secondary" onclick="summonCompanion(' + d.id + ')">' + d.name + "</button>";
    });
    html += "</div></div>";
  }
  WIVES.forEach(def => {
    const w = getWife(def.id);
    const isSummon = SUMMON_NAMES.includes(def.name);
    if (!w.unlocked && !isSummon) return;
    const locked = !w.unlocked;
    const cdLeft = w.lastDate ? Math.max(0, DATE_CD - (Date.now() - w.lastDate)) : 0;
    const cdMin = Math.ceil(cdLeft / 60000);
    html += '<div class="card" style="opacity:' + (locked ? 0.55 : 1) + '"><div class="flex">' +
      '<img class="companion-img" src="' + (def.img || "") + '" alt="" onerror="this.src=\'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(def.name) + '\'"/>' +
      '<div style="flex:1"><strong>' + def.name + "</strong> <span class=\"small\">(" + (def.race || "?") + ")</span>" +
      (w.fav ? " ★" : "") +
      '<div class="small">Lv ' + (w.level || 1) + " · Aff " + (w.affinity || 0) + " · " + (def.buff || "") + "</div>" +
      '<div class="bar"><div class="barFill" style="width:' + Math.min(100, w.intimacy || 0) + '%"></div></div>';
    if (locked) {
      html += isSummon
        ? '<button type="button" class="btn" onclick="summonCompanion(' + def.id + ')">Summon (' + SF_COST + " SF)</button>"
        : '<button type="button" class="btn" disabled>Locked</button>';
    } else {
      html += '<button type="button" class="btn" onclick="openGiftSelector(' + def.id + ')">Gift</button> ' +
        '<button type="button" class="btn" onclick="dateWife(' + def.id + ')" ' + (cdLeft > 0 ? "disabled" : "") + ">" +
        (cdLeft > 0 ? "Date (" + cdMin + "m)" : "Date") + "</button> " +
        '<button type="button" class="btn secondary" onclick="favouriteWife(' + def.id + ')">' + (w.fav ? "★ Fav" : "Favourite") + "</button> " +
        '<button type="button" class="btn secondary" onclick="showCompanionProfile(' + def.id + ')">Info</button>';
    }
    html += "</div></div></div>";
  });
  list.innerHTML = html || '<div class="card">No companions available yet.</div>';
}

const STORE_CATALOG = typeof STORE_ITEMS !== "undefined" ? STORE_ITEMS : [];
const STARTER_CATALOG = typeof STARTER_GEAR !== "undefined" ? STARTER_GEAR : [];
const MERCHANT_STOCK = typeof SLAVE_MERCHANT_STOCK !== "undefined" ? SLAVE_MERCHANT_STOCK : [];

function getStoreCost(item, level) {
  level = level || 0;
  if (item.type === "upgrade" || item.type === "permanent") {
    return Math.floor(item.cost * Math.pow(1.45, level));
  }
  return item.cost;
}

function unlockStarterGear(item) {
  if (!item) return;
  state.gear = state.gear || {};
  state.gear[item.id] = true;
  if (item.slot === "weapon") {
    state.weapon = item.id;
  } else if (typeof onStarterArmourPurchased === "function") {
    onStarterArmourPurchased(item.id);
  } else {
    state.armour = state.armour || {};
    state.armourLevels = state.armourLevels || {};
    state.armour[item.slot] = item.id;
    state.armourLevels[item.id] = 0;
  }
}

function buyStarter(id) {
  const item = STARTER_CATALOG.find(i => i.id === id);
  if (!item || (state.money || 0) < item.cost) return;
  if (state.ownedStarters && state.ownedStarters[item.id]) {
    if (typeof toast === "function") toast("Already owned");
    return;
  }
  state.money -= item.cost;
  if (!state.ownedStarters) state.ownedStarters = {};
  state.ownedStarters[item.id] = true;
  unlockStarterGear(item);
  if (typeof toast === "function") toast("Purchased " + item.name);
  markEconomyDirty();
  renderStore();
  if (typeof render === "function") render();
  void save();
}

function buyStoreItem(id) {
  const item = STORE_CATALOG.find(i => i.id === id);
  if (!item) return;
  const level = state.upgrades?.[item.key] || 0;
  const cost = getStoreCost(item, level);
  if ((state.money || 0) < cost) return;
  if (item.max && level >= item.max) return;
  state.money -= cost;

  if (item.type === "consumable") {
    if (item.effect === "income") {
      state.tempIncomeMult = item.mult || 2;
      state.tempIncomeEnd = Date.now() + (item.dur || 60000);
    } else if (item.effect === "tap") {
      state.tempTapMult = item.mult || 2;
      state.tempTapEnd = Date.now() + (item.dur || 60000);
    }
    addChallengeProgress("boost", 1);
    if (typeof toast === "function") toast(item.name + " activated!");
  } else {
    if (!state.upgrades) state.upgrades = {};
    state.upgrades[item.key] = level + 1;
    if (item.key === "practiceDummy") state.hasPracticeDummy = true;
    if (item.key === "trainingApparatus") state.hasTrainingApparatus = true;
    addChallengeProgress("upgrades", 1);
    markEconomyDirty();
    if (typeof toast === "function") toast(item.name + " → Lv " + (level + 1));
  }
  renderStore();
  if (typeof render === "function") render();
  void save();
}

function buySlave(id) {
  if ((state.prestige || 0) < 1) {
    if (typeof toast === "function") toast("Requires first reincarnation");
    return;
  }
  const s = MERCHANT_STOCK.find(x => x.id === id);
  if (!s || (state.money || 0) < s.cost) return;

  let owned = false;
  if (s.type === "companion") owned = !!getWife(s.refId).unlocked;
  else if (s.type === "tame") owned = !!getPetProgress(s.refId).unlocked;
  else if (s.type === "mount") owned = !!(state.mounts && state.mounts[s.refId] && state.mounts[s.refId].owned);
  if (owned) {
    if (typeof toast === "function") toast("Already owned");
    return;
  }

  state.money -= s.cost;
  if (s.type === "companion") setCompanionUnlocked(s.refId, true);
  else if (s.type === "tame") unlockTameFromMerchant(s.refId);
  else if (s.type === "mount") {
    if (!state.mounts) state.mounts = {};
    state.mounts[s.refId] = { owned: true };
  }
  if (typeof toast === "function") toast("Acquired " + s.name);
  renderStore();
  if (typeof renderMounts === "function") renderMounts();
  if (typeof render === "function") render();
  void save();
}

/* ---------- HOUSES (state-backed) ---------- */
function buyHouse(id) {
  if (typeof HOUSES === "undefined") return;
  const h = HOUSES.find(x => x.id === id) || HOUSES[id];
  if (!h) return;
  const st = ensureHouseState(h.id);
  if (st.owned || (state.money || 0) < h.cost) return;
  state.money -= h.cost;
  st.owned = true;
  markEconomyDirty();
  emitGameEvent("house:changed", { id: h.id });
  if (typeof toast === "function") toast("Purchased " + h.name);
  renderStore();
  renderHouses();
  if (typeof render === "function") render();
  void save();
}

function activateHouse(id) {
  if (typeof HOUSES === "undefined") return;
  const h = HOUSES.find(x => x.id === id) || HOUSES[id];
  if (!h || !isHouseOwned(h.id)) return;
  state.activeHouse = h.id;
  markEconomyDirty();
  emitGameEvent("house:changed", { id: h.id });
  if (typeof toast === "function") toast(h.name + " is now active");
  renderStore();
  renderHouses();
  if (typeof render === "function") render();
  void save();
}

function renderHouses() {
  const list = document.getElementById("housesList");
  if (!list || typeof HOUSES === "undefined") return;
  let html = '<div class="section">Your Residences</div>';
  HOUSES.forEach(h => {
    const owned = isHouseOwned(h.id);
    const active = state.activeHouse === h.id;
    html += '<div class="card ' + (active ? "equipped" : "") + '">';
    if (h.imgExterior) {
      html += '<img class="house-img" src="' + h.imgExterior + '" alt="' + h.name + '" loading="lazy" onerror="this.style.display=\'none\'"/>';
    }
    html += "<strong>" + h.name + '</strong> <span class="small">Rank ' + (h.rank || "?") + "</span>";
    html += '<div class="small">' + (h.desc || "") + "</div>";
    if (owned) {
      html += active
        ? '<button type="button" class="btn" disabled>Active</button>'
        : '<button type="button" class="btn" onclick="activateHouse(' + h.id + ')">Activate</button>';
    } else {
      html += '<button type="button" class="btn" onclick="buyHouse(' + h.id + ')" ' +
        ((state.money || 0) < h.cost ? "disabled" : "") + ">Buy " + h.cost.toLocaleString() + "</button>";
    }
    html += "</div>";
  });
  list.innerHTML = html;
}

function renderStore() {
  const list = document.getElementById("storeList");
  if (!list) return;
  let html = "";

  html += '<div class="section">Starter Gear</div>';
  STARTER_CATALOG.forEach(item => {
    const owned = !!(state.ownedStarters && state.ownedStarters[item.id]);
    html += '<div class="card"><strong>' + item.name + '</strong><div class="small">' + (item.desc || item.slot) + "</div>";
    html += owned
      ? '<button type="button" class="btn" disabled>Owned</button>'
      : '<button type="button" class="btn" onclick="buyStarter(\'' + item.id + '\')" ' +
        ((state.money || 0) < item.cost ? "disabled" : "") + ">Buy " + item.cost.toLocaleString() + "</button>";
    html += "</div>";
  });

  if (typeof HOUSES !== "undefined") {
    html += '<div class="section">Residences</div>';
    HOUSES.forEach(h => {
      const owned = isHouseOwned(h.id);
      const active = state.activeHouse === h.id;
      html += '<div class="card"><strong>' + h.name + '</strong><div class="small">' + (h.desc || "") + "</div>";
      if (owned) {
        html += active
          ? '<button type="button" class="btn" disabled>Active</button>'
          : '<button type="button" class="btn secondary" onclick="activateHouse(' + h.id + ')">Activate</button>';
      } else {
        html += '<button type="button" class="btn" onclick="buyHouse(' + h.id + ')" ' +
          ((state.money || 0) < h.cost ? "disabled" : "") + ">Buy " + h.cost.toLocaleString() + "</button>";
      }
      html += "</div>";
    });
  }

  html += '<div class="section">Upgrades & Items</div>';
  STORE_CATALOG.forEach(item => {
    const level = state.upgrades?.[item.key] || 0;
    const cost = getStoreCost(item, level);
    const maxed = item.max && level >= item.max;
    html += '<div class="card"><strong>' + item.name +
      (item.type !== "consumable" ? " (Lv " + level + ")" : "") +
      '</strong><div class="small">' + item.desc + "</div>";
    html += '<button type="button" class="btn" onclick="buyStoreItem(\'' + item.id + '\')" ' +
      (maxed || (state.money || 0) < cost ? "disabled" : "") + ">" +
      (maxed ? "MAX" : "Buy " + cost.toLocaleString()) + "</button></div>";
  });

  if ((state.prestige || 0) >= 1) {
    html += '<div class="section">Slave Merchant</div>';
    MERCHANT_STOCK.forEach(s => {
      let owned = false;
      if (s.type === "companion") owned = !!getWife(s.refId).unlocked;
      else if (s.type === "tame") owned = !!getPetProgress(s.refId).unlocked;
      else if (s.type === "mount") owned = !!(state.mounts && state.mounts[s.refId] && state.mounts[s.refId].owned);
      html += '<div class="card"><strong>' + s.name + '</strong><div class="small">' + (s.desc || s.type) + "</div>";
      html += owned
        ? '<button type="button" class="btn" disabled>Owned</button>'
        : '<button type="button" class="btn" onclick="buySlave(\'' + s.id + '\')" ' +
          ((state.money || 0) < s.cost ? "disabled" : "") + ">Buy " + s.cost.toLocaleString() + "</button>";
      html += "</div>";
    });
  } else {
    html += '<div class="section">Slave Merchant</div><div class="card locked"><strong>Hooded Merchant</strong>' +
      '<div class="small">Appears after first reincarnation…</div></div>';
  }

  list.innerHTML = html;
}

/* ---------- BUSINESS + GUILD ---------- */
function ensureBusinessState(id) {
  if (!state.businesses) state.businesses = {};
  if (!state.businesses[id]) state.businesses[id] = { owned: false, level: 0 };
  return state.businesses[id];
}

function buyBusiness(id) {
  if (typeof BUSINESSES === "undefined") return;
  const b = BUSINESSES.find(x => x.id === id);
  if (!b) return;
  const st = ensureBusinessState(id);
  if (st.owned || (state.money || 0) < b.cost) return;
  state.money -= b.cost;
  st.owned = true;
  st.level = 0;
  if (b.isGuild) state.guild.level = Math.max(state.guild.level || 0, 1);
  markEconomyDirty();
  emitGameEvent("business:bought", { id });
  addChallengeProgress("upgrades", 1);
  if (typeof onTutorialAction === "function") onTutorialAction("buyBusiness");
  if (typeof toast === "function") toast("Purchased " + b.name);
  renderBusiness();
  if (typeof render === "function") render();
  void save();
}

function upgradeBusiness(id) {
  if (typeof BUSINESSES === "undefined") return;
  const b = BUSINESSES.find(x => x.id === id);
  const st = ensureBusinessState(id);
  if (!b || !st.owned || b.isGuild) return;
  const max = b.maxLevel || 20;
  if ((st.level || 0) >= max) return;
  const cost = Math.floor(b.cost * 0.4 * Math.pow(1.35, st.level || 0));
  if ((state.money || 0) < cost) return;
  state.money -= cost;
  st.level = (st.level || 0) + 1;
  if (b.isGuild) state.guild.level = Math.max(state.guild.level || 0, st.level + 1);
  markEconomyDirty();
  emitGameEvent("business:upgraded", { id });
  if (typeof toast === "function") toast(b.name + " → Lv " + st.level);
  renderBusiness();
  if (typeof render === "function") render();
  void save();
}

function startGuildJob(jobId) {
  if (typeof GUILD_JOBS === "undefined") return;
  const job = GUILD_JOBS.find(j => j.id === jobId);
  if (!job) return;
  const guildLv = state.guild?.level || 0;
  if (guildLv < (job.minGuild || 1)) {
    if (typeof toast === "function") toast("Guild level too low");
    return;
  }
  if (state.guild.activeJobs && state.guild.activeJobs[jobId]) {
    if (typeof toast === "function") toast("Job already running");
    return;
  }
  if ((state.money || 0) < job.cost) return;
  state.money -= job.cost;
  if (!state.guild.activeJobs) state.guild.activeJobs = {};
  state.guild.activeJobs[jobId] = {
    start: Date.now(),
    duration: (job.duration || 60) * 1000
  };
  if (typeof toast === "function") toast("Started: " + job.name);
  renderBusiness();
  void save();
}

function updateGuildJobs() {
  if (!state.guild || !state.guild.activeJobs) return;
  const now = Date.now();
  let changed = false;
  Object.keys(state.guild.activeJobs).forEach(jobId => {
    const run = state.guild.activeJobs[jobId];
    if (!run) return;
    if (now - run.start < run.duration) return;
    const job = typeof GUILD_JOBS !== "undefined" ? GUILD_JOBS.find(j => j.id === jobId) : null;
    delete state.guild.activeJobs[jobId];
    changed = true;
    if (!job) return;
    const success = Math.random() < (job.successChance || 0.8);
    if (!success) {
      if (typeof toast === "function") toast(job.name + " failed");
      return;
    }
    const loot = {};
    const resMult = getPrestigeResourceMult();
    Object.entries(job.rewards || {}).forEach(([mat, range]) => {
      const lo = range[0], hi = range[1];
      let amt = Math.floor(lo + Math.random() * (hi - lo + 1));
      amt = Math.max(0, Math.floor(amt * resMult));
      if (amt > 0) loot[mat] = amt;
    });
    applyLoot(loot);
    if (typeof toast === "function") toast(job.name + " success: " + formatLoot(loot));
  });
  if (changed) {
    renderBusiness();
    if (typeof renderInventory === "function") renderInventory();
  }
}

function renderBusiness() {
  const list = document.getElementById("businessList");
  if (!list || typeof BUSINESSES === "undefined") return;
  let html = '<div class="section">Businesses</div>';
  BUSINESSES.forEach(b => {
    const st = ensureBusinessState(b.id);
    const owned = st.owned;
    const income = getBusinessIncome(b.id);
    html += '<div class="card"><strong>' + b.name + '</strong>';
    if (b.isGuild) html += ' <span class="tag">GUILD</span>';
    html += '<div class="small">' + (b.desc || ("Base " + b.baseIncome + "/s")) + "</div>";
    if (!owned) {
      html += '<button type="button" class="btn" onclick="buyBusiness(' + b.id + ')" ' +
        ((state.money || 0) < b.cost ? "disabled" : "") + ">Buy " + b.cost.toLocaleString() + "</button>";
    } else if (b.isGuild) {
      html += '<div class="small">Guild level: ' + (state.guild.level || 0) + "</div>";
      if (typeof GUILD_JOBS !== "undefined") {
        GUILD_JOBS.forEach(job => {
          const running = state.guild.activeJobs && state.guild.activeJobs[job.id];
          const left = running ? Math.max(0, Math.ceil((running.duration - (Date.now() - running.start)) / 1000)) : 0;
          html += '<div style="margin-top:6px"><strong class="small">' + job.name + "</strong> " +
            '<span class="small">(' + job.duration + "s · " + Math.floor(job.successChance * 100) + "%)</span><br/>";
          if (running) {
            html += '<span class="small">Running… ' + left + "s</span>";
          } else {
            html += '<button type="button" class="btn secondary" onclick="startGuildJob(\'' + job.id + '\')" ' +
              ((state.guild.level || 0) < job.minGuild || (state.money || 0) < job.cost ? "disabled" : "") +

function ensureMountState(id) {
  if (!state.mounts) state.mounts = {};
  if (!state.mounts[id]) state.mounts[id] = { owned: false };
  return state.mounts[id];
}

function canUnlockMount(m) {
  if (!m) return false;
  const u = m.unlock || {};
  if (u.merchant || m.merchant) return false;
  if (u.story && (state.storyProgress || 0) >= 1) return true;
  if (u.money != null && (state.money || 0) >= u.money) return true;
  if (u.prestige != null && (state.prestige || 0) >= u.prestige) return true;
  return false;
}

function buyMount(id) {
  if (typeof MOUNTS === "undefined") return;
  const m = MOUNTS.find(x => x.id === id);
  if (!m) return;
  if (m.merchant || (m.unlock && m.unlock.merchant)) {
    if (typeof toast === "function") toast("Merchant exclusive");
    return;
  }
  const st = ensureMountState(id);
  if (st.owned) return;
  if (!canUnlockMount(m) && (state.money || 0) < m.cost) {
    if (typeof toast === "function") toast("Requirements not met");
    return;
  }
  if ((state.money || 0) < m.cost) return;
  state.money -= m.cost;
  st.owned = true;
  if (typeof toast === "function") toast("Acquired " + m.name);
  renderMounts();
  if (typeof render === "function") render();
  void save();
}

function equipMount(id) {
  const st = ensureMountState(id);
  if (!st.owned) return;
  state.activeMount = state.activeMount === id ? null : id;
  if (typeof toast === "function") toast(state.activeMount ? "Mounted" : "Dismounted");
  renderMounts();
  void save();
}

function renderMounts() {
  const list = document.getElementById("mountsList");
  if (!list || typeof MOUNTS === "undefined") return;
  let html = '<div class="card small">Mounts are cosmetic. Merchant mounts via Slave Merchant after prestige.</div>';
  MOUNTS.forEach(m => {
    const st = ensureMountState(m.id);
    const merchantOnly = !!(m.merchant || (m.unlock && m.unlock.merchant));
    const active = state.activeMount === m.id;
    html += '<div class="card ' + (active ? "equipped" : "") + '">';
    if (m.img) {
      html += '<img class="house-img" src="' + m.img + '" alt="' + m.name + '" loading="lazy" onerror="this.style.display=\'none\'"/>';
    }
    html += "<strong>" + m.name + '</strong> <span class="small">Rank ' + m.rank + "</span>";
    html += '<div class="small">' + (m.desc || "") + "</div>";
    if (st.owned) {
      html += '<button type="button" class="btn" onclick="equipMount(\'' + m.id + '\')">' +
        (active ? "Unequip" : "Equip") + "</button>";
    } else if (merchantOnly) {
      html += '<button type="button" class="btn" disabled>Merchant only</button>';
    } else {
      html += '<button type="button" class="btn" onclick="buyMount(\'' + m.id + '\')" ' +
        ((state.money || 0) < m.cost ? "disabled" : "") + ">Buy " + m.cost.toLocaleString() + "</button>";
    }
    html += "</div>";
  });
  list.innerHTML = html;
}

function rollDungeonLoot(table, floor) {
  const gained = {};
  const resMult = getPrestigeResourceMult();
  (table || []).forEach(entry => {
    if (Math.random() < entry.chance + floor * 0.012) {
      let amount = Math.floor(entry.min + Math.random() * (entry.max - entry.min + 1));
      amount = Math.max(1, Math.floor(amount * resMult));
      gained[entry.id] = (gained[entry.id] || 0) + amount;

  });

function startDungeon(dungeonId) {
  ensureDungeonState();
  const dungeon = getDungeonById(dungeonId);
  if (!dungeon) return;
  const chapter = state.storyProgress || 0;
  const prestiges = state.prestige || 0;
  if (chapter < dungeon.unlockChapter || prestiges < dungeon.requiresPrestige) {
    if (typeof toast === "function") toast("Dungeon still locked!");
    return;
  }
  if ((state.stamina || 0) < dungeon.staminaCost) {
    if (typeof toast === "function") toast("Not enough stamina");
    return;
  }
  let currentFloor = (state.dungeonProgress[dungeonId] || 0) + 1;

  const floorScale = 1 + (currentFloor - 1) * 0.28;
  const required = Math.floor(dungeon.basePower * floorScale * globalDiff.powerMult * tierMod.powerMult);
  const playerPower = getPlayerPower();
  const victory = Math.random() < Math.min(0.92, playerPower / Math.max(1, required));

  if (victory) {
    state.dungeonProgress[dungeonId] = currentFloor;
    const loot = rollDungeonLoot(dungeon.lootTable || [], currentFloor);

    state.money = (state.money || 0) + gold;

    if (currentFloor >= dungeon.floors) {
      if (!state.clearedDungeons.includes(dungeonId)) state.clearedDungeons.push(dungeonId);
      const oldTier = getDungeonTier(dungeonId);
      if (oldTier < 3) {
        state.dungeonTier[dungeonId] = oldTier + 1;
        if (typeof toast === "function") toast(dungeon.name + " is now " + DUNGEON_TIERS[oldTier + 1].name);
      }
      const idx = DUNGEON_LIST.findIndex(d => d.id === dungeonId);
      if (idx >= 0) state.storyProgress = Math.max(state.storyProgress || 0, idx + 1);
      addChallengeProgress("dungeonClear", 1);
      state.dungeonProgress[dungeonId] = 0;
    }
    const msg = "Victory!\n" + dungeon.name + " F" + currentFloor + "/" + dungeon.floors + "\n+" + gold + " gold · " + formatLoot(loot);
    addToBattleLog("Victory " + dungeon.name + " F" + currentFloor);
    if (typeof showModal === "function") showModal("✦ Victory ✦", msg);
  } else {
    state.life = Math.max(10, (state.life || 100) - 12);
    addToBattleLog("Defeat " + dungeon.name + " F" + currentFloor);
    if (typeof showModal === "function") {
      showModal("✦ Defeat ✦", dungeon.name + " Floor " + currentFloor + "\nPower " + playerPower + " vs ~" + required + " · -12 Life");
    }
  }
  markEconomyDirty();
  renderDungeon();
  renderInventory();
  if (typeof render === "function") render();
  void save();
}

function setIdleDungeon(id) {
  ensureDungeonState();
  const dungeon = getDungeonById(id);
  if (!dungeon) return;
  if ((state.storyProgress || 0) < dungeon.unlockChapter || (state.prestige || 0) < dungeon.requiresPrestige) {
    if (typeof toast === "function") toast("Dungeon locked");
    return;
  }
  state.activeDungeon = { id, startTime: Date.now(), duration: 45000 };
  if (typeof toast === "function") toast("Idle dungeon: " + dungeon.name);
  renderDungeon();
  void save();
}
function clearIdleDungeon() {
  state.activeDungeon = null;
  renderDungeon();
  void save();
}
function processIdleDungeon() {
  if (!state.activeDungeon) return;
  const elapsed = Date.now() - state.activeDungeon.startTime;
  if (elapsed >= (state.activeDungeon.duration || 45000)) {
    state.activeDungeon.startTime = Date.now();
    startDungeon(state.activeDungeon.id);
  }
  updateIdleProgressBar();
}
function updateIdleProgressBar() {
  if (!state.activeDungeon) return;
  const bar = document.getElementById("idleProgressBar");
  const text = document.getElementById("idleProgressText");
  const elapsed = Date.now() - state.activeDungeon.startTime;
  const dur = state.activeDungeon.duration || 45000;
  const pct = Math.min(100, (elapsed / dur) * 100);
  if (bar) bar.style.width = pct + "%";
  if (text) text.textContent = "Next attempt in " + Math.max(0, Math.ceil((dur - elapsed) / 1000)) + "s";
}

function runCaveDiving(id) {
  ensureDungeonState();
  const cave = CAVE_DIVING.find(c => c.id === id);
  if (!cave) return;
  if ((state.stamina || 0) < cave.stamina) { if (typeof toast === "function") toast("Not enough stamina"); return; }
  if (getPlayerPower() < cave.powerNeeded) { if (typeof toast === "function") toast("Need " + cave.powerNeeded + " power"); return; }
  state.stamina -= cave.stamina;
  const resMult = getPrestigeResourceMult();
  const gained = {};
  Object.entries(cave.rewards).forEach(([mat, range]) => {
    let amt = Math.floor(range[0] + Math.random() * (range[1] - range[0] + 1));
    amt = Math.floor(amt * resMult);
    if (amt > 0) { gained[mat] = amt; state.inventory[mat] = (state.inventory[mat] || 0) + amt; }
  });
  if (typeof showModal === "function") showModal("✦ Cave Diving ✦", formatLoot(gained));
  markEconomyDirty();
  renderDungeon();
  renderInventory();
  if (typeof render === "function") render();
  void save();
}

function runMonsterHunt(id) {

  if (!hunt) return;
  if ((state.stamina || 0) < hunt.stamina) { if (typeof toast === "function") toast("Not enough stamina"); return; }

  if (typeof showModal === "function") showModal("✦ Monster Hunt ✦", hunt.name + " · +" + gold + "g · " + amt + "× " + mat);

  renderDungeon();
  renderInventory();
  if (typeof render === "function") render();
  void save();
}

const STORY_BASE_SEED = 2026;
const STORY_BIOMES = [
  "Grasslands", "Forest", "Ocean", "Desert",
  "Void", "Under-trove", "Dimensional Gate", "Snowy Mountains"
];
const STORY_NODE_REWARDS = {
  grasslands_2: { type: "wife", id: 13, name: "Mira" },
  forest_3: { type: "wife", id: 7, name: "Isolde" },
  desert_2: { type: "wife", id: 8, name: "Kira" },
  void_1: { type: "wife", id: 10, name: "Luna" },
  ocean_2: { type: "pet", id: 4, name: "Blaze" },
  forest_1: { type: "pet", id: 2, name: "Shade" }
};

function getStorySeed() {
  return STORY_BASE_SEED + ((state.prestige || 0) * 7919);
}
function seededRandom(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function generateLore(biome, index, seed) {
  const rand = seededRandom(seed + index * 97);
  const templates = {
    Grasslands: ["Soft winds carry wildflowers across the plains.", "A lone tree watches the path."],
    Forest: ["Ancient trees whisper older than kingdoms.", "Glowing mushrooms light the roots."],
    Ocean: ["Salt spray stings as waves crash.", "Something moves beneath the surface."],
    Desert: ["Heat shimmers over golden dunes.", "Tracks lead toward a distant oasis."],
    Void: ["Reality frays at the edges.", "Stars hang too close."],
    "Under-trove": ["An underground forest glows softly.", "Ore veins glitter in the walls."],
    "Dimensional Gate": ["Reality thins near the archway.", "Other worlds flicker in the gate."],
    "Snowy Mountains": ["Icy wind howls across the peaks.", "Breath freezes with every step."]
  };
  const list = templates[biome] || ["The path continues."];
  return list[Math.floor(rand() * list.length)];
}

function generateStoryMap() {
  const seed = getStorySeed();
  const rand = seededRandom(seed);
  const prestige = state.prestige || 0;
  const nodes = [];
  let id = 0;
  STORY_BIOMES.forEach((biome, bi) => {
    const count = bi < 2 ? 4 : bi < 5 ? 5 : 6;
    for (let i = 0; i < count; i++) {
      const group = bi < 2 ? "basic" : bi < 5 ? "medium" : "hard";
      const key = biome.toLowerCase().replace(/\s+/g, "_") + "_" + i;
      const powerReq = Math.floor(30 + id * 14 + bi * 20 + rand() * 10);
      const goldReq = Math.floor(300 + id * 180 + bi * 420 + (group === "hard" ? 800 : 0));
      const manaReq = Math.floor(4 + id * 1.2 + bi * 2.5);
      let houseReq = prestige === 0
        ? Math.min(14, Math.floor(bi * 1.8 + i / 2))
        : Math.min(18, Math.floor(bi * 2.2 + i));
      let mountReq = Math.min(10, Math.floor(bi * 1.4 + i / 2));
      nodes.push({
        id, key, biome, group, indexInBiome: i,
        title: biome + " – " + (i + 1),
        lore: generateLore(biome, id, seed),
        req: {
          power: powerReq, money: goldReq, mana: manaReq,
          houseRank: houseReq, mountRank: mountReq
        },
        rewards: {
          money: Math.floor(goldReq * 1.6),
          materials: group === "basic"
            ? { wood: 4 + i, herb: 2 + i }
            : group === "medium"
              ? { iron_ore: 2 + i, crystal: 1 }
              : { mithril_ore: 1 + Math.floor(i / 2), shadow_essence: 1 }
        },
        chargeTime: group === "basic" ? 12 : group === "medium" ? 20 : 28,
        isFinal: bi === STORY_BIOMES.length - 1 && i === count - 1,
        rewardKey: STORY_NODE_REWARDS[key] ? key : null
      });
      id++;
    }
  });
  return nodes;
}

function ensureStoryState() {
  if (!state.story || typeof state.story !== "object") {
    state.story = {
      current: 0, completed: [], charging: null, map: null,
      extremeMode: false, lastResourceTick: Date.now(),
      selectedNode: 0, storyCompleted: false, mana: 12, maxMana: 12
    };
  }
  if (!Array.isArray(state.story.completed)) state.story.completed = [];
  if (state.story.storyCompleted == null) state.story.storyCompleted = false;
  if (state.story.mana == null) state.story.mana = 12;
  if (state.story.maxMana == null) state.story.maxMana = 12;
  if (!state.story.map || !state.story.map.length) state.story.map = generateStoryMap();
}

function onPrestigeStory() {
  state.story = {
    current: 0, completed: [], charging: null, map: null,
    extremeMode: true, lastResourceTick: Date.now(),
    selectedNode: 0, storyCompleted: false,
    mana: 12, maxMana: Math.min(60, 12 + (state.prestige || 0) * 4)
  };
  state.storyProgress = 0;
  ensureStoryState();
}

function getHousingRank() {
  let max = 0;
  Object.keys(state.houses || {}).forEach(id => {
    if (state.houses[id] && state.houses[id].owned) {
      const house = HOUSES.find(x => x.id == id);
      if (house) max = Math.max(max, house.rank || 0);
    }
  });
  return max;
}
function getMaxMountRank() {
  let max = 0;
  Object.keys(state.mounts || {}).forEach(id => {
    if (state.mounts[id] && state.mounts[id].owned) {
      const m = typeof MOUNTS !== "undefined" ? MOUNTS.find(x => x.id === id) : null;
      if (m) max = Math.max(max, m.rank || 0);
    }
  });
  return max;
}

function getNodeRequirementErrors(node) {
  const errors = [];
  if (!node) return ["Invalid node"];
  if (state.story.completed.includes(node.id)) return ["Already completed"];
  if (node.id > 0 && !state.story.completed.includes(node.id - 1)) errors.push("Complete previous node first");
  if (typeof isTutorialActive === "function" && isTutorialActive()) errors.push("Finish the tutorial first");
  const req = node.req || {};
  const power = getPlayerPower();
  if (power < (req.power || 0)) errors.push("Power " + power + "/" + req.power);
  if ((state.money || 0) < (req.money || 0)) errors.push("Gold low");
  if ((state.story.mana || 0) < (req.mana || 0)) errors.push("Mana " + state.story.mana + "/" + req.mana);
  if (req.houseRank && getHousingRank() < req.houseRank) errors.push("House Rank " + getHousingRank() + "/" + req.houseRank);
  if (req.mountRank && getMaxMountRank() < req.mountRank) errors.push("Mount Rank " + getMaxMountRank() + "/" + req.mountRank);
  return errors;
}

function startCharging(nodeId) {
  ensureStoryState();
  if (typeof isTutorialActive === "function" && isTutorialActive()) {
    if (typeof toast === "function") toast("The God still has more to teach you...");
    return;
  }
  const node = state.story.map.find(n => n.id === nodeId);
  if (!node || state.story.completed.includes(nodeId) || state.story.charging) return;
  const errs = getNodeRequirementErrors(node);
  if (errs.length) {
    if (typeof toast === "function") toast(errs[0]);
    return;
  }
  state.story.mana = Math.max(0, (state.story.mana || 0) - (node.req?.mana || 0));
  state.story.current = nodeId;
  state.story.selectedNode = nodeId;
  state.story.charging = { nodeId, progress: 0, startTime: Date.now() };
  if (typeof toast === "function") toast("Traveling: " + node.title);
  renderStory();
  void save();
}

function applyStoryUnlock(reward) {
  if (!reward) return;
  if (reward.type === "wife") {
    setCompanionUnlocked(reward.id, true);
    if (typeof showModal === "function") showModal("✦ New Companion ✦", (reward.name || "Companion") + " has joined you!");
  }
  if (reward.type === "pet") {
    if (reward.id === 0 || reward.id === 9) return;
    unlockTameFromStory(reward.id);
  }
}

function completeStoryNode(node) {
  if (!node || state.story.completed.includes(node.id)) return;
  state.money = (state.money || 0) + (node.rewards?.money || 0);
  const resMult = getPrestigeResourceMult();
  Object.entries(node.rewards?.materials || {}).forEach(([id, amount]) => {
    state.inventory[id] = (state.inventory[id] || 0) + Math.floor(amount * resMult);
  });
  if (node.rewardKey && STORY_NODE_REWARDS[node.rewardKey]) applyStoryUnlock(STORY_NODE_REWARDS[node.rewardKey]);
  state.story.completed.push(node.id);
  state.storyProgress = Math.max(state.storyProgress || 0, node.id + 1);
  addChallengeProgress("nodes", 1);
  const next = state.story.map.find(n => n.id === node.id + 1);
  if (next) {
    state.story.current = next.id;
    state.story.selectedNode = next.id;
  }
  if (node.isFinal) {
    state.story.storyCompleted = true;
    if (typeof showModal === "function") showModal("✦ Story Complete ✦", "You may Prestige at Year 25.");
  } else if (typeof toast === "function") toast("Node complete: " + node.title);
  markEconomyDirty();
  void save();
}

function storyTick() {
  ensureStoryState();
  if (!state.story.charging) return;
  const node = state.story.map.find(n => n.id === state.story.charging.nodeId);
  if (!node) { state.story.charging = null; return; }
  const timeNeed = node.chargeTime * (state.story.extremeMode ? 1.15 : 1);
  const elapsed = (Date.now() - state.story.charging.startTime) / 1000;
  state.story.charging.progress = Math.min(100, (elapsed / timeNeed) * 100);

  }
}

      '<div class="small">' + node.biome + "</div></div>";
  });
  list.innerHTML = html;
}

/* ---------- PRESTIGE ---------- */
const PRESTIGE_UP_TABLE = typeof PRESTIGE_UPGRADES !== "undefined" ? PRESTIGE_UPGRADES : [];

function estimatePP() {
  const year = state.year || 18;
  const money = Math.max(1, state.money || 1);
  const nodes = (state.story?.completed?.length) || 0;
  const clears = (state.clearedDungeons?.length) || 0;
  return Math.max(1, Math.floor(year * 2 + Math.log10(money + 1) * 8 + nodes * 0.5 + clears * 2));
}
function canPrestige() {
  if ((state.year || 18) < 25) return { ok: false, reason: "Reach Year 25 first." };
  if (!state.story?.storyCompleted) return { ok: false, reason: "Finish the main story first." };
  if (typeof isTutorialActive === "function" && isTutorialActive()) return { ok: false, reason: "Complete the tutorial first." };
  return { ok: true, reason: "" };
}
function ensurePrestigeState() {
  state.prestigeUpgrades = state.prestigeUpgrades || { pTap: 0, pIncome: 0, pStart: 0, pKibble: 0, pMoney: 0, pRes: 0, pIntim: 0 };

  if (!state.unlockedHeroes.includes(0)) state.unlockedHeroes.unshift(0);

function unlockNextHero() {
  if (typeof HEROES === "undefined") return null;
  const hero = HEROES.find(h => h.unlock && h.unlock.prestige === state.prestige);
  if (hero && !state.unlockedHeroes.includes(hero.id)) {
    state.unlockedHeroes.push(hero.id);
    return hero;
  }
  return null;

function applyPrestigeSoftReset() {
  const startBonus = (state.prestigeUpgrades?.pStart || 0) * 500;
  state.money = 500 + startBonus;
  state.year = 18;
  state.day = 1;
  state.life = 100 + (state.prestige || 0) * 15;

function doPrestige() {
  ensurePrestigeState();
  const gate = canPrestige();
  if (!gate.ok) {
    if (typeof showModal === "function") showModal("✦ Not Ready ✦", gate.reason);
    return;
  }
  const gain = estimatePP();
  state.prestige = (state.prestige || 0) + 1;
  state.prestigePoints = (state.prestigePoints || 0) + gain;
  unlockNextHero();
  applyPrestigeSoftReset();
  onPrestigeStory();
  state.pendingHeroSelect = true;
  markEconomyDirty();
  emitGameEvent("prestige:up", {});
  void save();
  if (state.prestige === 1 && state.tutorial) {
    const idx = TUTORIAL_STEPS.findIndex(s => s.id === "post_prestige_welcome");
    if (idx >= 0) {
      state.tutorial.step = idx;
      state.tutorial.active = true;
      state.tutorial.completed = false;
    }
  }
  setTimeout(() => {
    if (typeof playCutscene === "function") {
      playCutscene("prestige_return", () => {
        if (typeof isTutorialActive === "function" && isTutorialActive()) runTutorialStep();
        else if (typeof openHeroSelect === "function") openHeroSelect(true);
      });
    } else if (typeof openHeroSelect === "function") openHeroSelect(true);
  }, 400);
}

function buyPrestigeUpgrade(id) {
  ensurePrestigeState();
  const u = PRESTIGE_UP_TABLE.find(x => x.id === id);
  if (!u) return;
  const lvl = state.prestigeUpgrades[u.key] || 0;
  if (lvl >= u.max) return;
  const cost = u.cost * (lvl + 1);
  if ((state.prestigePoints || 0) < cost) return;
  state.prestigePoints -= cost;
  state.prestigeUpgrades[u.key] = lvl + 1;
  markEconomyDirty();
  void save();
  renderPrestige();
}

function renderPrestige() {
  ensurePrestigeState();
  const pLevel = document.getElementById("pLevel");
  const pPoints = document.getElementById("pPoints");
  const estPP = document.getElementById("estPP");
  if (pLevel) pLevel.textContent = state.prestige || 0;
  if (pPoints) pPoints.textContent = state.prestigePoints || 0;
  if (estPP) estPP.textContent = estimatePP();
  const list = document.getElementById("prestigeUpList");
  if (!list) return;
  const gate = canPrestige();
  let html = '<div class="card"><strong>Reincarnation</strong>' +
    '<div class="small">Year ' + Number(state.year || 18).toFixed(1) +
    " · Story: " + (state.story?.storyCompleted ? "Complete ✓" : "Incomplete") + "</div>" +
    '<button type="button" class="btn" ' + (gate.ok ? "" : "disabled") + ' onclick="doPrestige()">Reincarnate (+' + estimatePP() + " PP)</button>" +
    (gate.ok ? "" : '<div class="small" style="color:#f88">' + gate.reason + "</div>") + "</div>" +
    '<div class="section">Prestige Upgrades</div>';
  PRESTIGE_UP_TABLE.forEach(u => {
    const lvl = state.prestigeUpgrades[u.key] || 0;
    const cost = u.cost * (lvl + 1);
    html += '<div class="card"><strong>' + u.name + '</strong> <span class="small">Lv ' + lvl + "/" + u.max + "</span>" +

      '<button type="button" class="btn" onclick="buyPrestigeUpgrade(\'' + u.id + '\')" ' +

      (lvl >= u.max ? "Maxed" : cost + " PP") + "</button></div>";
  });
  list.innerHTML = html;
}

function ensureTutorialState() {
  if (!state.tutorial) state.tutorial = { active: true, step: 0, completed: false };
}
function isTutorialActive() {
  ensureTutorialState();
  return state.tutorial.active && !state.tutorial.completed;
}
function startTutorial() {
  ensureTutorialState();
  if (state.tutorial.completed) return;
  state.tutorial.active = true;
  state.tutorial.step = 0;
  runTutorialStep();
}
function runTutorialStep() {
  ensureTutorialState();
  clearTutorialHighlight();
  if (state.tutorial.step >= TUTORIAL_STEPS.length) { completeTutorial(); return; }
  const step = TUTORIAL_STEPS[state.tutorial.step];
  if (step.type === "cutscene") playCutscene(step.cutsceneId, () => advanceTutorial());
  else if (step.type === "highlight") highlightElement(step.target, step.message);
}
function advanceTutorial() {
  state.tutorial.step++;
  void save();
  runTutorialStep();
}
function completeTutorial() {
  state.tutorial.active = false;
  state.tutorial.completed = true;
  clearTutorialHighlight();
  if (typeof toast === "function") toast("Tutorial complete.");
  void save();
}
function highlightElement(selector, message) {
  clearTutorialHighlight();
  const el = document.querySelector(selector);
  if (!el) { setTimeout(() => advanceTutorial(), 2000); return; }
  const rect = el.getBoundingClientRect();
  const highlight = document.createElement("div");
  highlight.id = "tutorialHighlight";
  highlight.style.cssText = "position:absolute;pointer-events:none;z-index:9990;border:3px solid #c77dff;border-radius:12px;box-shadow:0 0 25px #c77dff;left:" +
    (rect.left + window.scrollX - 6) + "px;top:" + (rect.top + window.scrollY - 6) + "px;width:" + (rect.width + 12) + "px;height:" + (rect.height + 12) + "px";
  document.body.appendChild(highlight);
  const msg = document.createElement("div");
  msg.id = "tutorialMessage";
  msg.style.cssText = "position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:rgba(15,10,30,0.95);border:2px solid #c77dff;color:#eee;padding:14px 20px;border-radius:12px;z-index:9991;max-width:90%;text-align:center";
  msg.innerHTML = "<strong style=\"color:#c77dff\">God</strong><br>" + message;
  document.body.appendChild(msg);
}
function clearTutorialHighlight() {
  document.getElementById("tutorialHighlight")?.remove();
  document.getElementById("tutorialMessage")?.remove();
}
function onTutorialAction(action) {
  if (!isTutorialActive()) return;
  const step = TUTORIAL_STEPS[state.tutorial.step];
  if (step?.type === "highlight" && step.requireAction === action) advanceTutorial();
}
