<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Idle Life Tycoon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 12px;
      overflow-x: hidden;
    }
    .container {
      max-width: 430px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .avatar {
      font-size: 64px;
      margin: 8px 0;
    }
    .money {
      font-size: 32px;
      font-weight: 800;
      color: #4ade80;
    }
    .income {
      font-size: 14px;
      color: #94a3b8;
      margin-top: 4px;
    }
    .career {
      background: #1e293b;
      padding: 8px 16px;
      border-radius: 20px;
      display: inline-block;
      margin-top: 8px;
      font-size: 14px;
    }
    .tap-btn {
      width: 100%;
      height: 90px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      border-radius: 20px;
      color: white;
      font-size: 28px;
      font-weight: 700;
      margin: 16px 0;
      box-shadow: 0 8px 20px rgba(59,130,246,0.4);
      transition: transform 0.1s;
    }
    .tap-btn:active {
      transform: scale(0.96);
    }
    .section {
      background: #1e293b;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .section h3 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #94a3b8;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      margin: 6px 0;
    }
    .shop-item, .objective {
      background: #0f172a;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .shop-item button, .objective button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      white-space: nowrap;
    }
    .shop-item button:disabled {
      background: #475569;
      opacity: 0.6;
    }
    .owned {
      color: #4ade80;
      font-size: 12px;
    }
    .progress-bar {
      height: 6px;
      background: #334155;
      border-radius: 3px;
      margin-top: 6px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #3b82f6;
      width: 0%;
      transition: width 0.3s;
    }
    .tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
    }
    .tab {
      padding: 8px 14px;
      background: #1e293b;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      border: 2px solid transparent;
    }
    .tab.active {
      border-color: #3b82f6;
      background: #1e3a8a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="avatar" id="avatar">??</div>
      <div class="money" id="money">$0</div>
      <div class="income" id="income">+$0 / sec</div>
      <div class="career" id="career">Unemployed</div>
    </div>
